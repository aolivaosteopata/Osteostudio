<style>
/* ==========================================================================
   1. DESIGN TOKENS
   ========================================================================== */
:root{
  --bg:#edf1ef;
  --surface:#fbfcfb;
  --surface-2:#f3f6f5;
  --surface-3:#e5ebe8;
  --border:#d6dfdb;
  --border-strong:#bfccc7;
  --text:#1a2622;
  --muted:#586863;
  --faint:#8a9893;
  --accent:#2c6e63;
  --accent-strong:#225a50;
  --accent-soft:#dfeeea;
  --accent-text:#ffffff;
  --info:#33609f;
  --info-soft:#e5edf8;
  --ok:#2a7549;
  --ok-soft:#e0f1e6;
  --warn:#8f5c00;
  --warn-soft:#f9efd6;
  --danger:#b73a35;
  --danger-soft:#f9e6e5;
  --body-fill:#e2e9e6;
  --body-stroke:#83978f;
  --body-detail:#a6b7b0;
  --shadow-sm:0 1px 2px rgba(18,40,34,.06);
  --shadow:0 1px 2px rgba(18,40,34,.05), 0 8px 24px rgba(18,40,34,.06);
  --shadow-lg:0 24px 64px rgba(10,26,22,.24);
  --r-lg:20px;
  --r:14px;
  --r-sm:10px;
  --sidebar:236px;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --font-display:ui-serif, "New York", "Iowan Old Style", "Palatino", Georgia, serif;
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-l:env(safe-area-inset-left, 0px);
  --safe-r:env(safe-area-inset-right, 0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1513; --surface:#161e1c; --surface-2:#1b2522; --surface-3:#232f2c;
    --border:#2a3834; --border-strong:#3a4b46;
    --text:#e1e9e6; --muted:#9dafa9; --faint:#6f807a;
    --accent:#63b3a2; --accent-strong:#7cc4b4; --accent-soft:#1c3531; --accent-text:#0b1614;
    --info:#86a9e8; --info-soft:#1b283d; --ok:#72c795; --ok-soft:#183024;
    --warn:#e2b150; --warn-soft:#33291a; --danger:#ee7d76; --danger-soft:#3a1f1d;
    --body-fill:#1f2b28; --body-stroke:#72877f; --body-detail:#46594f;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.25), 0 10px 28px rgba(0,0,0,.28);
    --shadow-lg:0 24px 64px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#161e1c; --surface-2:#1b2522; --surface-3:#232f2c;
  --border:#2a3834; --border-strong:#3a4b46;
  --text:#e1e9e6; --muted:#9dafa9; --faint:#6f807a;
  --accent:#63b3a2; --accent-strong:#7cc4b4; --accent-soft:#1c3531; --accent-text:#0b1614;
  --info:#86a9e8; --info-soft:#1b283d; --ok:#72c795; --ok-soft:#183024;
  --warn:#e2b150; --warn-soft:#33291a; --danger:#ee7d76; --danger-soft:#3a1f1d;
  --body-fill:#1f2b28; --body-stroke:#72877f; --body-detail:#46594f;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.25), 0 10px 28px rgba(0,0,0,.28);
  --shadow-lg:0 24px 64px rgba(0,0,0,.55);
  color-scheme:dark;
}

/* ==========================================================================
   2. BASE
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font); font-size:16px; line-height:1.5; color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; overflow:hidden;
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
}
h1,h2,h3,h4{margin:0;line-height:1.2;font-weight:600}
h1{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:-.01em}
h2{font-size:18px}
h3{font-size:16px}
p{margin:0}
code{font-size:.92em;background:var(--surface-3);padding:1px 6px;border-radius:6px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid color-mix(in srgb, var(--accent) 55%, transparent);outline-offset:2px}
.ic{flex:none;display:block}
.muted{color:var(--muted)}
.sm{font-size:14px}
.spacer{flex:1}
[hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }

/* ==========================================================================
   3. STRUTTURA APP
   ========================================================================== */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;height:100vh;height:100dvh}
.sidebar{
  display:flex;flex-direction:column;gap:6px;background:var(--surface);border-right:1px solid var(--border);
  padding:calc(18px + var(--safe-t)) 14px calc(16px + var(--safe-b)) calc(14px + var(--safe-l));
  overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px}
.brand-mark svg{display:block;width:40px;height:40px}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-text strong{font-family:var(--font-display);font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{
  display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border:0;border-radius:var(--r);
  background:transparent;color:var(--muted);font-weight:500;text-align:left;transition:background .15s,color .15s;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-strong)}
.nav-item .count{margin-left:auto;font-size:12px;background:var(--surface-3);color:var(--muted);border-radius:99px;padding:1px 8px}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--border)}
.offline-badge{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:13px;color:var(--muted)}
.offline-badge i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.main{position:relative;overflow:hidden;min-width:0;height:100vh;height:100dvh}
.page{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(26px + var(--safe-t)) calc(30px + var(--safe-r)) calc(48px + var(--safe-b)) 30px}
.page.narrow > *{max-width:880px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head .sub{color:var(--muted);margin-top:4px}
.date-line{color:var(--muted);font-size:15px;margin-bottom:4px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

@media (max-width: 1000px){
  :root{--sidebar:76px}
  .brand{justify-content:center;padding:4px 0 16px}
  .brand-text,.nav-item span,.offline-badge span,.nav-item .count{display:none}
  .nav-item{justify-content:center;padding:0}
  .offline-badge{justify-content:center;padding:6px 0}
  .page{padding-left:22px;padding-right:calc(22px + var(--safe-r))}
}

/* ==========================================================================
   4. COMPONENTI
   ========================================================================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;
  border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
  font-weight:500;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,transform .08s;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-ghost{border-color:transparent;background:transparent;color:var(--danger)}
.btn.danger-ghost:hover{background:var(--danger-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.55;pointer-events:none}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);flex:none;
}
.icon-btn:hover{color:var(--text);background:var(--surface-2)}
.icon-btn.sm{width:34px;height:34px;border-radius:10px}
.icon-btn.ok{color:var(--ok)} .icon-btn.ok:hover{background:var(--ok-soft)}
.icon-btn.danger{color:var(--danger)} .icon-btn.danger:hover{background:var(--danger-soft)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--shadow-sm)}
.card + .card,.card + .grid-2,.grid-2 + .card,.grid-2 + .grid-2,.banner + .card,.card + .banner{margin-top:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-head h2,.card-head h3{display:flex;align-items:center;gap:10px}
.card > h2{margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-2 > .card{margin:0}
@media (max-width: 900px){ .grid-2{grid-template-columns:1fr} }

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.neutral{background:var(--surface-3);color:var(--muted)}

.banner{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-radius:var(--r);border:1px solid}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb, var(--warn) 35%, transparent);color:var(--text)}
.banner.warn .ic{color:var(--warn);margin-top:2px}
.banner.danger{background:var(--danger-soft);border-color:color-mix(in srgb, var(--danger) 35%, transparent)}
.banner.danger .ic{color:var(--danger);margin-top:2px}
.banner strong{display:block;margin-bottom:2px}
.banner p{white-space:pre-wrap;color:var(--text)}
.banner .btn{margin-left:auto;flex:none}

.form-grid{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:14px 18px}
.form-grid .wide{grid-column:1 / -1}
@media (max-width: 700px){ .form-grid{grid-template-columns:1fr} }
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:14px;font-weight:600;color:var(--muted)}
.field small{color:var(--faint);font-size:13px}
input[type=text],input[type=search],input[type=tel],input[type=email],input[type=date],input[type=time],input[type=password],input:not([type]),select,textarea{
  width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--border-strong);border-radius:var(--r-sm);
  background:var(--surface-2);font-size:16px;color:var(--text);-webkit-appearance:none;appearance:none;
  transition:border-color .15s, background .15s, box-shadow .15s;
}
input[type=date],input[type=time]{display:flex;align-items:center}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
textarea{min-height:110px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent)}
input::placeholder,textarea::placeholder{color:var(--faint)}
.upper{text-transform:uppercase}
.hint{font-size:14px;color:var(--muted);margin-top:10px}
.form-warn{margin-top:12px;padding:10px 14px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:500}
.row-end{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:16px}

.seg{display:inline-flex;background:var(--surface-3);border-radius:12px;padding:3px;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:500;font-size:15px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.seg.full{display:flex}
.seg.full button{flex:1;justify-content:center}
.seg button.on.st-pianificato{color:var(--info)}
.seg button.on.st-eseguito{color:var(--ok)}
.seg button.on.st-annullato{color:var(--danger)}

.toggle{display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;-webkit-user-select:none;user-select:none}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle .track{position:relative;width:46px;height:28px;border-radius:99px;background:var(--border-strong);transition:background .2s;flex:none}
.toggle .track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle input:checked + .track{background:var(--accent)}
.toggle input:checked + .track::after{transform:translateX(18px)}
.toggle input:focus-visible + .track{outline:3px solid color-mix(in srgb, var(--accent) 55%, transparent);outline-offset:2px}
.toggle input:disabled + .track{opacity:.5}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:22px 0 20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;border:0;background:transparent;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--accent-strong);border-bottom-color:var(--accent)}
.tab .count{font-size:12px;background:var(--surface-3);border-radius:99px;padding:1px 8px;color:var(--muted)}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 16px;color:var(--muted)}
.empty .ic{color:var(--faint);margin-bottom:6px}
.empty strong{color:var(--text);font-weight:600}

.avatar{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);font-weight:700;font-size:15px;flex:none;letter-spacing:.02em}
.avatar.lg{width:60px;height:60px;font-size:21px;font-family:var(--font-display)}

/* ==========================================================================
   5. DASHBOARD & AGENDA
   ========================================================================== */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;display:flex;gap:14px;align-items:center}
.stat .ic-wrap{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;flex:none}
.stat strong{display:block;font-family:var(--font-display);font-size:28px;line-height:1.1;font-weight:600}
.stat span{color:var(--muted);font-size:14px}
@media (max-width: 1100px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
.dash-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.dash-grid .card{margin:0}
.dash-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.dash-grid > *{min-width:0}
.mini-row .grow{min-width:0}
.mini-row .grow strong,.mini-row .grow small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appt-body{min-width:0}
.appt-body small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width: 1100px){ .dash-grid{grid-template-columns:minmax(0,1fr)} }

.appt-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.appt{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);padding:4px 6px 4px 4px}
.appt-main{flex:1;display:flex;align-items:center;gap:14px;min-width:0;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:12px}
.appt-time{display:flex;flex-direction:column;min-width:52px;border-left:3px solid var(--info);padding-left:10px}
.appt.eseguito .appt-time{border-left-color:var(--ok)}
.appt.annullato .appt-time{border-left-color:var(--danger)}
.appt-time strong{font-variant-numeric:tabular-nums;font-size:16px}
.appt-time small{color:var(--faint);font-variant-numeric:tabular-nums}
.appt-body{flex:1;display:flex;flex-direction:column;min-width:0}
.appt-body strong{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt-body small{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt.annullato .appt-body strong{text-decoration:line-through;color:var(--muted)}
.appt-quick{display:flex;gap:6px}

.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--border);stroke-width:1}
.chart .axis{fill:var(--faint);font-size:12px;font-family:var(--font)}
.chart .axis.today{fill:var(--accent-strong);font-weight:700}
.chart .val{fill:var(--text);font-size:12px;font-weight:700;font-family:var(--font)}
.chart .vas-dot{cursor:pointer}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.mini-list{list-style:none;margin:0;padding:0}
.mini-list li + li{border-top:1px solid var(--border)}
.mini-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border:0;background:transparent;text-align:left}
.mini-row .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.mini-row .grow strong{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-row .grow small{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.agenda-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.agenda-bar .range{font-family:var(--font-display);font-size:20px;font-weight:600;margin:0 6px;min-width:220px}
.week{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));gap:10px;min-width:920px}
.day{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;min-height:420px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.weekend{background:var(--surface-2)}
.day-head{display:flex;align-items:center;gap:8px;padding:10px 8px 10px 12px;border-bottom:1px solid var(--border)}
.day-head span{color:var(--muted);font-size:13px;text-transform:capitalize}
.day-head strong{font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1}
.day.today .day-head strong{color:var(--accent-strong)}
.day-head .icon-btn{margin-left:auto}
.day-body{display:flex;flex-direction:column;gap:6px;padding:8px}
.day-empty{color:var(--faint);font-size:13px;text-align:center;padding:14px 0}
.wcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:0;border-radius:10px;padding:8px 10px;background:var(--info-soft);border-left:3px solid var(--info)}
.wcard.eseguito{background:var(--ok-soft);border-left-color:var(--ok)}
.wcard.annullato{background:var(--surface-3);border-left-color:var(--danger);opacity:.75}
.wcard.annullato strong{text-decoration:line-through}
.wcard time{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.wcard strong{font-size:14px;font-weight:600;line-height:1.3;word-break:break-word}
.wcard small{font-size:12px;color:var(--muted)}
.day-group + .day-group{margin-top:20px}
.day-group h3{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:10px;text-transform:capitalize}
.week-summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* ==========================================================================
   6. PAZIENTI
   ========================================================================== */
.split{display:grid;grid-template-columns:340px 1fr;height:100%}
.pane{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.list-pane{background:var(--surface);border-right:1px solid var(--border);padding:calc(22px + var(--safe-t)) 14px calc(24px + var(--safe-b))}
.detail-pane{padding:calc(22px + var(--safe-t)) calc(30px + var(--safe-r)) calc(48px + var(--safe-b)) 30px}
.list-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 14px}
.search{display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--border-strong);border-radius:12px;background:var(--surface-2);color:var(--muted);margin-bottom:12px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent)}
.search input{border:0 !important;background:transparent !important;box-shadow:none !important;padding:10px 0;min-height:46px}
.list-count{font-size:13px;color:var(--faint);padding:0 6px 8px}
.patient-list{display:flex;flex-direction:column;gap:2px}
.p-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:0;border-radius:12px;background:transparent;text-align:left}
.p-item:hover{background:var(--surface-2)}
.p-item.active{background:var(--accent-soft)}
.p-item .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.p-item .grow strong{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-item .grow small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-item .flag{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.back-btn{display:none}
@media (max-width: 900px){
  .split{grid-template-columns:1fr}
  .split.show-detail .list-pane{display:none}
  .split:not(.show-detail) .detail-pane{display:none}
  .back-btn{display:inline-flex}
  .list-pane{border-right:0}
  .detail-pane{padding-left:22px;padding-right:calc(22px + var(--safe-r))}
}
.p-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.p-head-text{flex:1;min-width:200px}
.p-head-text h2{font-family:var(--font-display);font-size:28px;font-weight:600}
.p-head-text p{margin-top:2px}
.p-head .back-btn{flex-basis:100%;justify-content:flex-start;width:max-content}
.p-head + .banner{margin-top:18px}
.detail-empty{height:100%;display:flex;align-items:center;justify-content:center}
.ana-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ana-grid .card{margin:0}
.ana-grid .card.warn{border-color:color-mix(in srgb, var(--warn) 45%, var(--border));background:color-mix(in srgb, var(--warn-soft) 55%, var(--surface))}
.ana-grid .card h3{margin-bottom:4px}
.ana-grid .card p.muted{font-size:13px;margin-bottom:10px}
.ana-grid textarea{min-height:130px}
@media (max-width: 1100px){ .ana-grid{grid-template-columns:1fr} }
.danger-zone{border-color:color-mix(in srgb, var(--danger) 35%, var(--border))}
.danger-zone h2{color:var(--danger)}
.danger-zone p{color:var(--muted);margin-bottom:14px}
.meta-foot{font-size:13px;color:var(--faint);margin-top:14px}

.consent{display:grid;grid-template-columns:auto 1fr auto;gap:6px 16px;align-items:center;padding:18px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface)}
.consent + .consent{margin-top:14px}
.consent-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--warn-soft);color:var(--warn);grid-row:span 2}
.consent.ok .consent-icon{background:var(--ok-soft);color:var(--ok)}
.consent-text{display:flex;flex-direction:column;min-width:0}
.consent-text strong{font-weight:600}
.consent-text span{font-size:14px;color:var(--muted);word-break:break-word}
.consent-actions{grid-column:2 / -1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.session-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:18px}
.s-card{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;text-align:left;padding:0}
.s-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow)}
.s-card canvas{width:100%;aspect-ratio:16/10;display:block;background:var(--surface-2);border-bottom:1px solid var(--border)}
.s-card .s-body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;width:100%}
.s-card .s-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.s-card .s-top strong{font-weight:600}
.s-card .s-sym{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s-card .s-tags{display:flex;gap:6px;flex-wrap:wrap}
.vas-badge{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:26px;padding:0 8px;border-radius:99px;font-size:13px;font-weight:700;color:#fff;background:var(--c, var(--faint))}
.vas-badge.none{background:var(--surface-3);color:var(--muted)}

/* ==========================================================================
   7. SEDUTA E MAPPA DEL DOLORE
   ========================================================================== */
.session-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.session-head .title{flex:1;min-width:220px}
.session-head h1{font-size:27px}
.save-status{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);min-height:32px}
.save-status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.save-status.saving::before{background:var(--warn)}
.save-status.error::before{background:var(--danger)}
.session-top{display:grid;grid-template-columns:200px 1fr;gap:14px 18px}
.session-top .vas-field{grid-column:1 / -1}
@media (max-width: 800px){ .session-top{grid-template-columns:1fr} }
.vas{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px}
.vas-btn{min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);transition:background .12s,color .12s,transform .08s}
.vas-btn:hover{border-color:var(--c)}
.vas-btn.on{background:var(--c);border-color:var(--c);color:#fff;transform:scale(1.04)}
.vas-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--faint);margin-top:6px}
.vas-meta strong{color:var(--text);font-weight:600}

.pm-toolbar{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.pm-colors{display:flex;gap:8px;flex-wrap:wrap}
.swatch{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 8px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface-2);font-size:14px;font-weight:600;color:var(--text)}
.swatch .dot{width:26px;height:26px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.swatch.on{border-color:var(--sw);background:color-mix(in srgb, var(--sw) 14%, var(--surface));box-shadow:0 0 0 2px color-mix(in srgb, var(--sw) 35%, transparent)}
.pm-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pm-size{display:inline-flex;align-items:center;gap:10px;padding:0 12px;min-height:44px;border-radius:12px;background:var(--surface-3)}
.pm-size input[type=range]{width:150px;accent-color:var(--accent)}
.pm-lbl{font-size:14px;font-weight:600;color:var(--muted)}
.pm-brushes button span{white-space:nowrap}
#pmStroke{pointer-events:none}
.pm-size output{min-width:22px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.size-dot-box{width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.size-dot{display:block;border-radius:50%;background:var(--text)}
.size-dot.eraser{background:transparent;border:2px dashed var(--muted)}
.pm-actions{display:flex;gap:8px;margin-left:auto}
.pm-wrap{
  position:relative;width:100%;aspect-ratio:16 / 10;border-radius:var(--r);overflow:hidden;
  background:
    radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--body-detail) 55%, transparent) 1px, transparent 1.5px) 0 0 / 22px 22px,
    var(--surface-2);
  border:1px solid var(--border);
}
.pm-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#pmDraw{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.pm-cursor{position:absolute;left:0;top:0;border-radius:50%;border:1.5px solid var(--text);pointer-events:none;opacity:0;transition:opacity .12s;mix-blend-mode:difference}
.pm-cursor.show{opacity:.8}
.pm-legend{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}

.tech-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width: 900px){ .tech-grid{grid-template-columns:1fr} }
.tech-group{border:1px solid var(--border);border-radius:var(--r);padding:14px;background:var(--surface-2)}
.tech-group h3{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:15px}
.tech-group h3 span{font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;background:var(--surface-3);color:var(--muted)}
.tech-group h3 span.has{background:var(--accent);color:var(--accent-text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface);font-size:14px;font-weight:500;color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.chip.add{display:inline-flex;align-items:center;gap:4px;border-style:dashed;color:var(--accent);background:transparent}
.tech-group.primary{border-color:var(--accent);background:var(--accent-soft);margin-bottom:14px}
.tech-group.primary h3{font-size:17px}
.tech-group.primary .chip{min-height:44px;font-size:15px}
.tech-more{border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2)}
.tech-more > summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:600;color:var(--muted)}
.tech-more > summary::-webkit-details-marker{display:none}
.tech-more > summary::before{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
.tech-more[open] > summary::before{transform:rotate(45deg)}
.tech-more > summary .count{font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;background:var(--accent);color:var(--accent-text)}
.tech-more > .tech-grid{padding:0 14px 14px}
.custom-tech{display:flex;flex-direction:column;gap:12px}
.custom-tech .chips{display:flex;flex-wrap:wrap;gap:8px}
.custom-tech .chip{display:inline-flex;align-items:center;gap:6px}
.linked{display:inline-flex;align-items:center;gap:6px}

/* ==========================================================================
   8. BACKUP & IMPOSTAZIONI
   ========================================================================== */
.file-chip{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);margin-top:14px}
.file-chip .ic{color:var(--accent)}
.file-chip div{display:flex;flex-direction:column;min-width:0}
.file-chip strong{font-weight:600;word-break:break-all}
.file-chip span{font-size:14px;color:var(--muted)}
.radio-cards{border:0;padding:0;margin:16px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width: 700px){ .radio-cards{grid-template-columns:1fr} }
.radio-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;background:var(--surface)}
.radio-card:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-card input{margin-top:4px;accent-color:var(--accent);width:20px;height:20px;flex:none}
.radio-card span{display:flex;flex-direction:column}
.radio-card small{color:var(--muted);font-size:14px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;color:var(--text)}
.steps li::marker{color:var(--accent);font-weight:700}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.kv div{padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border)}
.kv span{display:block;font-size:13px;color:var(--muted)}
.kv strong{font-size:18px;font-weight:600}
.version{margin-top:22px;font-size:13px;color:var(--faint)}
.stack{display:flex;flex-direction:column;gap:4px}

/* ==========================================================================
   9. MODALI & TOAST
   ========================================================================== */
#modal-root{position:relative;z-index:50}
.modal-backdrop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(20px + var(--safe-t)) 20px calc(20px + var(--safe-b));background:rgba(8,22,18,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;transition:opacity .18s}
.modal-backdrop.show{opacity:1}
.modal{width:min(600px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--surface);border-radius:22px;box-shadow:var(--shadow-lg);transform:translateY(10px) scale(.99);transition:transform .2s}
.modal-backdrop.show .modal{transform:none}
.modal.sm{width:min(440px,100%)}
.modal.xl{width:min(1100px,100%);height:100%}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 12px 24px}
.modal-head h3{font-family:var(--font-display);font-size:22px;font-weight:600}
.modal-body{padding:6px 24px 20px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.modal.xl .modal-body{display:flex;flex-direction:column;gap:12px}
.modal-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px 18px 24px;border-top:1px solid var(--border)}
.confirm-text{font-size:16px;line-height:1.55;white-space:pre-line}
.pdf-frame{flex:1;min-height:320px;border-radius:var(--r);overflow:hidden;border:1px solid var(--border);background:var(--surface-2)}
.pdf-frame iframe{width:100%;height:100%;border:0;display:block}
#toast-root{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,calc(100% - 32px))}
.toast{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;background:var(--text);color:var(--bg);box-shadow:var(--shadow-lg);font-size:15px;font-weight:500;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none}
.toast.error .ic{color:#ff9b94}
.toast.ok .ic{color:#8fe0b0}
.fatal{max-width:560px;margin:15vh auto;padding:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
.fatal h1{margin-bottom:10px}

/* ==========================================================================
   BLOCCO CON PASSWORD
   ========================================================================== */
.lock-screen{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;
  padding:calc(24px + var(--safe-t)) 24px calc(24px + var(--safe-b));background:var(--bg);overflow:auto}
.lock-card{width:min(420px,100%);display:flex;flex-direction:column;align-items:stretch;gap:14px;text-align:center;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:32px 28px;box-shadow:var(--shadow)}
.lock-card h1{font-family:var(--font-display);font-weight:600;font-size:1.7rem;margin:4px 0 0}
.lock-card p{margin:0}
.lock-icon{align-self:center;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent)}
.lock-card input[type=password]{font-size:1.15rem;padding:14px 16px;border-radius:var(--r);border:1px solid var(--border-strong);
  background:var(--surface-2);color:var(--text);text-align:center;letter-spacing:.08em}
.lock-card input[type=password]:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.lock-card .btn{justify-content:center;min-height:50px;font-size:1.05rem}
.lock-msg{min-height:1.3em;color:var(--danger);font-size:.95rem;margin:0}
.lock-msg.info{color:var(--muted)}
.lock-link{background:none;border:0;color:var(--accent);font:inherit;font-size:.92rem;padding:8px;cursor:pointer}
.lock-card.shake{animation:lockShake .38s ease}
@keyframes lockShake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.sec-card > p, .sec-card > .field{margin:0 0 12px}
.sec-status{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:600;font-size:.85rem;
  background:var(--ok-soft);color:var(--ok)}
.sec-status.off{background:var(--warn-soft);color:var(--warn)}
/* Copertura dell'anteprima nel multitasking */
html.privacy #app, html.privacy #modal-root, html.privacy #toast-root{visibility:hidden !important}
html.privacy body{background:var(--bg)}

/* ==========================================================================
   PAGAMENTI
   ========================================================================== */
.pay-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;align-items:end}
.pay-seg{display:flex;width:100%}
.pay-seg button{flex:1;justify-content:center;white-space:nowrap;padding:0 8px}
.seg button.on.ps-da_saldare{color:var(--warn)}
.seg button.on.ps-saldata{color:var(--ok)}
.pay-note{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 0;padding:10px 12px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-size:14px}
.pay-note .btn{margin-left:auto}
.pay-stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.pay-stats .stat{padding:14px}
.pay-stats .stat strong{font-size:22px}
.pay-list,.pay-history{list-style:none;margin:0;padding:0}
.pay-list li{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border)}
.pay-list li:last-child,.pay-history li:last-child{border-bottom:0}
.pay-row{display:flex;align-items:center;gap:14px;flex:1;padding:12px 4px;cursor:pointer}
.pay-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.pay-row .grow,.pay-history .grow{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.pay-row small,.pay-history small{color:var(--muted);font-size:13px}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pay-history li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border)}
.s-top .s-pills{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigazione principale"></aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden>
<input type="file" id="importInput" accept="application/json,.json,text/plain" hidden>

<script>
'use strict';

/* ==========================================================================
   1. COSTANTI E CONFIGURAZIONE
   ========================================================================== */
const APP = Object.freeze({
  name: 'OsteoStudio',
  version: '2.1.0',
  dbName: 'osteostudio-db',
  dbVersion: 1,
  backupFormat: 'osteostudio-backup',
  backupVersion: 1
});

const PM_W = 1600;               // risoluzione interna fissa della mappa del dolore
const PM_H = 1000;
const MAX_PDF_BYTES = 40 * 1024 * 1024;
const UNDO_LIMIT = 12;
const PBKDF2_ITERATIONS = 310000;

const PAIN_COLORS = Object.freeze([
  { id: 'acuto',       label: 'Acuto',       color: '#e5484d' },
  { id: 'cronico',     label: 'Cronico',     color: '#3b7ff0' },
  { id: 'neuro',       label: 'Neurologico', color: '#e9b106' },
  { id: 'subacuto',    label: 'Subacuto',    color: '#f27a1a' },
  { id: 'irradiato',   label: 'Irradiato',   color: '#9d5cf0' },
  { id: 'parestesia',  label: 'Parestesia',  color: '#12a37f' }

function uid() {

  const rnd = new Uint8Array(12);

}

function fmtDate(value, style = 'medium') {
  if (!value) return '—';
  const d = value instanceof Date ? value : (String(value).length === 10 ? parseISODate(value) : new Date(value));
  if (Number.isNaN(d.getTime())) return '—';
  return DF[style].format(d);
}

function fmtDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '—';
  return `${DF.short.format(d)} alle ${DF.time.format(d)}`;
}

function toMinutes(time) { const [h, m] = String(time || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); }
function fromMinutes(t) { const v = ((t % 1440) + 1440) % 1440; return `${pad(Math.floor(v / 60))}:${pad(v % 60)}`; }
function addMinutes(time, min) { return fromMinutes(toMinutes(time) + Number(min || 0)); }

function ageOf(iso) {
  if (!iso) return null;
  const b = parseISODate(iso);
  if (Number.isNaN(b.getTime())) return null;
  const n = new Date();
  let a = n.getFullYear() - b.getFullYear();
  if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--;
  return a >= 0 && a < 130 ? a : null;
}

function fmtBytes(n) {
  const v = Number(n) || 0;
  if (v < 1024) return `${v} B`;
  if (v < 1048576) return `${(v / 1024).toFixed(1).replace('.', ',')} KB`;
  if (v < 1073741824) return `${(v / 1048576).toFixed(1).replace('.', ',')} MB`;
  return `${(v / 1073741824).toFixed(2).replace('.', ',')} GB`;
}

function bytesToB64(bytes) {
  let s = '';
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  return btoa(s);
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function dataUrlToBlob(dataUrl) {
  const i = dataUrl.indexOf(',');
  const head = dataUrl.slice(0, i);
  const mime = (head.match(/^data:([^;,]+)/) || [])[1] || 'application/octet-stream';
  return new Blob([b64ToBytes(dataUrl.slice(i + 1))], { type: mime });
}

const DB = {
  db: null,

  open() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window) || !window.indexedDB) {
        reject(new Error('IndexedDB non è disponibile in questo browser o contesto.'));
        return;
      }
      let req;
      try { req = indexedDB.open(APP.dbName, APP.dbVersion); }
      catch (err) { reject(err); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        const ensure = (name, keyPath, indexes = []) => {
          const store = db.objectStoreNames.contains(name) ? req.transaction.objectStore(name) : db.createObjectStore(name, { keyPath });
          indexes.forEach((ix) => { if (!store.indexNames.contains(ix)) store.createIndex(ix, ix, { unique: false }); });
        };
        ensure('patients', 'id');
        ensure('sessions', 'id', ['patientId']);
        ensure('appointments', 'id', ['patientId', 'date']);
        ensure('files', 'id', ['patientId']);
        ensure('settings', 'key');
      };
      req.onsuccess = () => {
        this.db = req.result;
        this.db.onversionchange = () => { this.db.close(); location.reload(); };
        resolve(this.db);
      };
      req.onerror = () => reject(req.error || new Error('Impossibile aprire il database locale.'));
      req.onblocked = () => reject(new Error('Il database è bloccato da un’altra finestra di OsteoStudio. Chiudila e ricarica.'));
    });
  },

  _done(tx) {
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error('Errore di scrittura nel database.'));
      tx.onabort = () => reject(tx.error || new Error('Scrittura annullata (spazio esaurito?).'));
    });
  },

  _req(r) {
    return new Promise((resolve, reject) => {
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  },

  /* --- Cifratura trasparente -------------------------------------------------
     Quando il blocco con password è attivo (DB.key impostata), ogni record viene
     salvato come { id, patientId?, __enc, iv, ct }: il contenuto è cifrato con
     AES-256-GCM; restano in chiaro solo l'identificativo casuale e il riferimento
     al paziente, necessari agli indici del database. */
  key: null,
  _indexFields: { sessions: ['patientId'], appointments: ['patientId'], files: ['patientId'] },
  _keyPath(store) { return store === 'settings' ? 'key' : 'id'; },

  async _enc(store, value) {
    if (!this.key || !value || (store === 'settings' && value.key === 'lock')) return value;
    const kp = this._keyPath(store);
    const box = await Lock.encryptWith(this.key, JSON.stringify(value));
    const rec = { [kp]: value[kp], __enc: 1, iv: box.iv, ct: box.ct };
    (this._indexFields[store] || []).forEach((f) => { if (value[f] != null) rec[f] = value[f]; });
    return rec;
  },

  async _dec(rec) {
    if (!rec || !rec.__enc) return rec;
    if (!this.key) throw new Error('Archivio bloccato: inserisci la password.');
    return JSON.parse(await Lock.decryptWith(this.key, rec));
  },

  rawGet(store, key) { return this._req(this.db.transaction(store, 'readonly').objectStore(store).get(key)); },

  async rawPut(store, value) {
    const tx = this.db.transaction(store, 'readwrite');
    tx.objectStore(store).put(value);
    await this._done(tx);
  },

  async getAll(store) {
    const raw = await this._req(this.db.transaction(store, 'readonly').objectStore(store).getAll());
    const visible = store === 'settings' ? raw.filter((r) => r.key !== 'lock') : raw;
    return Promise.all(visible.map((r) => this._dec(r)));
  },

  async get(store, key) { return this._dec(await this.rawGet(store, key)); },

  async put(store, value) {
    const rec = await this._enc(store, value);        // cifra PRIMA di aprire la transazione
    const tx = this.db.transaction(store, 'readwrite');
    tx.objectStore(store).put(rec);
    await this._done(tx);
    return value;
  },

  async putMany(store, values) {
    if (!values || !values.length) return;
    const recs = await Promise.all(values.map((v) => this._enc(store, v)));
    const tx = this.db.transaction(store, 'readwrite');
    const os = tx.objectStore(store);
    recs.forEach((r) => os.put(r));
    await this._done(tx);
  },

  async delete(store, key) {
    const tx = this.db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    await this._done(tx);
  },

  async deleteMany(store, keys) {
    if (!keys || !keys.length) return;
    const tx = this.db.transaction(store, 'readwrite');
    const os = tx.objectStore(store);
    keys.forEach((k) => os.delete(k));
    await this._done(tx);
  },

  async deleteByIndex(store, index, value) {
    const tx = this.db.transaction(store, 'readwrite');
    const os = tx.objectStore(store);
    const req = os.index(index).openKeyCursor(IDBKeyRange.only(value));
    req.onsuccess = () => {
      const cursor = req.result;
      if (cursor) { os.delete(cursor.primaryKey); cursor.continue(); }
    };
    await this._done(tx);
  },

  async replaceAll(data) {
    const stores = ['patients', 'sessions', 'appointments', 'files'];
    const enc = {};
    for (const n of stores) enc[n] = await Promise.all((data[n] || []).map((v) => this._enc(n, v)));
    const appRec = await this._enc('settings', { key: 'app', value: { ...DEFAULT_SETTINGS, ...(data.settings || {}) } });
    const tx = this.db.transaction([...stores, 'settings'], 'readwrite');
    stores.forEach((n) => { const os = tx.objectStore(n); os.clear(); enc[n].forEach((r) => os.put(r)); });
    tx.objectStore('settings').put(appRec);             // la configurazione del blocco resta intatta
    await this._done(tx);
  },

  /** Riscrive l'intero archivio con una nuova chiave (null = senza cifratura) in un'unica transazione. */
  async rekey(newKey, lockConfig) {
    const stores = ['patients', 'sessions', 'appointments', 'files'];
    const plain = {};
    for (const n of stores) plain[n] = await this.getAll(n);
    const app = await this.get('settings', 'app');
    const previous = this.key;
    this.key = newKey;
    try {
      const enc = {};
      for (const n of stores) enc[n] = await Promise.all(plain[n].map((v) => this._enc(n, v)));
      const appRec = app ? await this._enc('settings', app) : null;
      const tx = this.db.transaction([...stores, 'settings'], 'readwrite');
      stores.forEach((n) => { const os = tx.objectStore(n); os.clear(); enc[n].forEach((r) => os.put(r)); });
      const st = tx.objectStore('settings');
      if (appRec) st.put(appRec);
      if (lockConfig) st.put(lockConfig); else st.delete('lock');
      await this._done(tx);
    } catch (err) {
      this.key = previous;
      throw err;
    }
  },

  /** Svuota completamente l'archivio, configurazione del blocco compresa. */
  async nuke() {
    const names = ['patients', 'sessions', 'appointments', 'files', 'settings'];
    const tx = this.db.transaction(names, 'readwrite');
    names.forEach((n) => tx.objectStore(n).clear());
    await this._done(tx);
  }
};

/* ==========================================================================
   5. CRITTOGRAFIA BACKUP (Web Crypto: PBKDF2-SHA256 + AES-256-GCM)
   ========================================================================== */
const Vault = {
  available() {
    return !!(window.crypto && window.crypto.subtle && typeof window.crypto.subtle.deriveKey === 'function');
  },

  async deriveKey(password, salt, iterations) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
      base,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  },

  async encrypt(plainText, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await this.deriveKey(password, salt, PBKDF2_ITERATIONS);
    const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, tagLength: 128 }, key, new TextEncoder().encode(plainText));
    return {
      kdf: { name: 'PBKDF2', hash: 'SHA-256', iterations: PBKDF2_ITERATIONS, salt: bytesToB64(salt) },
      cipher: { name: 'AES-GCM', keyLength: 256, tagLength: 128, iv: bytesToB64(iv) },
      data: bytesToB64(new Uint8Array(cipher))
    };
  },

  async decrypt(envelope, password) {
    const salt = b64ToBytes(envelope.kdf.salt);
    const iv = b64ToBytes(envelope.cipher.iv);
    const key = await this.deriveKey(password, salt, Number(envelope.kdf.iterations) || PBKDF2_ITERATIONS);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv, tagLength: 128 }, key, b64ToBytes(envelope.data));
    return new TextDecoder().decode(plain);
  }
};

/* ==========================================================================
   5b. BLOCCO CON PASSWORD E CIFRATURA DELL'ARCHIVIO LOCALE
   ========================================================================== */
const LOCK_VERIFIER = 'osteostudio-lock-ok';

const Lock = {
  config: null,
  hiddenAt: 0,
  lastActivity: Date.now(),
  locking: false,

  get enabled() { return !!this.config; },
  get autoLockMin() { return Number(this.config?.autoLockMin) || 5; },

  async loadConfig() { this.config = (await DB.rawGet('settings', 'lock')) || null; },

  async encryptWith(key, text) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, tagLength: 128 }, key, new TextEncoder().encode(text));
    return { iv, ct };
  },

  async decryptWith(key, box) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: box.iv, tagLength: 128 }, key, box.ct);
    return new TextDecoder().decode(plain);
  },

  async makeConfig(password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await Vault.deriveKey(password, salt, PBKDF2_ITERATIONS);
    const verifier = await this.encryptWith(key, LOCK_VERIFIER);
    return {
      key,
      config: { key: 'lock', v: 1, salt: bytesToB64(salt), iterations: PBKDF2_ITERATIONS, verifier,
                autoLockMin: this.config?.autoLockMin || 5, createdAt: nowISO() }
    };
  },

  /** Restituisce la chiave se la password è corretta, altrimenti null. */
  async keyFor(password, config = this.config) {
    if (!config) return null;
    try {
      const key = await Vault.deriveKey(password, b64ToBytes(config.salt), Number(config.iterations) || PBKDF2_ITERATIONS);
      return (await this.decryptWith(key, config.verifier)) === LOCK_VERIFIER ? key : null;
    } catch (e) { return null; }
  },

  async enable(password) {
    const { key, config } = await this.makeConfig(password);
    await DB.rekey(key, config);
    this.config = config;
  },

  async change(oldPassword, newPassword) {
    if (!(await this.keyFor(oldPassword))) throw new Error('La password attuale non è corretta.');
    const { key, config } = await this.makeConfig(newPassword);
    await DB.rekey(key, config);
    this.config = config;
  },

  async disable(password) {
    if (!(await this.keyFor(password))) throw new Error('La password non è corretta.');
    await DB.rekey(null, null);
    this.config = null;
  },

  async setAutoLock(minutes) {
    if (!this.config) return;
    this.config = { ...this.config, autoLockMin: minutes };
    await DB.rawPut('settings', this.config);
  },

  failures() { try { return JSON.parse(localStorage.getItem('osteostudio.lock') || '{}') || {}; } catch (e) { return {}; } },
  setFailures(value) { try { localStorage.setItem('osteostudio.lock', JSON.stringify(value)); } catch (e) { /* facoltativo */ } },

  /** Blocca subito: salva, cancella la chiave dalla memoria ricaricando la pagina. */
  lockNow() {
    if (!this.enabled || this.locking) return;
    this.locking = true;
    document.documentElement.classList.add('privacy');
    Promise.resolve(Saver.flush()).catch(() => {}).finally(() => location.reload());
  },

  bindAutoLock() {
    const mark = () => { this.lastActivity = Date.now(); };
    ['pointerdown', 'keydown', 'input', 'wheel', 'touchstart'].forEach((t) =>
      document.addEventListener(t, mark, { passive: true, capture: true }));
    document.addEventListener('visibilitychange', () => {
      if (!this.enabled) return;
      if (document.visibilityState === 'hidden') {
        this.hiddenAt = Date.now();
        document.documentElement.classList.add('privacy');
      } else {
        if (this.hiddenAt && Date.now() - this.hiddenAt >= this.autoLockMin * 60000) { this.lockNow(); return; }
        this.hiddenAt = 0;
        this.lastActivity = Date.now();
        document.documentElement.classList.remove('privacy');
      }
    });
    window.addEventListener('pageshow', (e) => { if (e.persisted && this.enabled) this.lockNow(); });
    setInterval(() => {
      if (this.enabled && document.visibilityState === 'visible' &&
          Date.now() - this.lastActivity >= this.autoLockMin * 60000) this.lockNow();
    }, 15000);
    document.addEventListener('change', (e) => {
      if (e.target && e.target.id === 'autoLockSel') {
        this.setAutoLock(Number(e.target.value))
          .then(() => toast('Blocco automatico aggiornato', 'ok'))
          .catch((err) => toast(err?.message || 'Impostazione non salvata', 'error'));
      }
    });
  }
};

/** Schermata di sblocco: si risolve quando la password è corretta. */
const LockScreen = {
  show() {
    return new Promise((resolve) => {
      const el = document.createElement('div');
      el.className = 'lock-screen';
      el.id = 'lock-screen';
      el.innerHTML = `
        <form class="lock-card" autocomplete="off" novalidate>
          <div class="lock-icon">${ic('lock', 36)}</div>
          <h1>OsteoStudio è bloccato</h1>
          <p class="muted">L’archivio dei pazienti è cifrato. Inserisci la password per aprirlo.</p>
          <input type="password" id="lockPw" placeholder="Password" autocomplete="off" autocapitalize="off"
                 autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Password">
          <p class="lock-msg" id="lockMsg" role="alert"></p>
          <button type="submit" class="btn primary" id="lockBtn">Sblocca</button>
          <button type="button" class="lock-link" id="lockForgot">Password dimenticata?</button>
        </form>`;
      document.body.appendChild(el);
      const form = el.querySelector('form');
      const pw = el.querySelector('#lockPw');
      const msg = el.querySelector('#lockMsg');
      const btn = el.querySelector('#lockBtn');
      let busy = false;

      const tick = () => {
        const wait = Math.max(0, (Lock.failures().until || 0) - Date.now());
        if (wait > 0) {
          msg.textContent = `Troppi tentativi errati. Riprova tra ${Math.ceil(wait / 1000)} secondi.`;
          btn.disabled = true;
          pw.disabled = true;
        } else if (pw.disabled && !busy) {
          btn.disabled = false;
          pw.disabled = false;
          msg.textContent = '';
          pw.focus();
        }
      };
      const timer = setInterval(tick, 1000);
      tick();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (busy || !pw.value) return;
        if ((Lock.failures().until || 0) > Date.now()) return;
        busy = true;
        btn.disabled = true;
        btn.textContent = 'Verifica…';
        const key = await Lock.keyFor(pw.value);
        busy = false;
        btn.textContent = 'Sblocca';
        if (key) {
          Lock.setFailures({});
          DB.key = key;
          clearInterval(timer);
          el.remove();
          resolve();
          return;
        }
        const n = (Lock.failures().n || 0) + 1;
        const until = n >= 5 ? Date.now() + Math.min(900, 30 * 2 ** (n - 5)) * 1000 : 0;
        Lock.setFailures({ n, until });
        pw.value = '';
        btn.disabled = false;
        msg.textContent = n >= 3 ? `Password errata (${n} tentativi).` : 'Password errata.';
        const card = el.querySelector('.lock-card');
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
        tick();
        if (!pw.disabled) pw.focus();
      });

      el.querySelector('#lockForgot').addEventListener('click', async () => {
        const first = await confirmDialog(
          'La password non può essere recuperata: l’archivio è cifrato e senza password resta illeggibile, per chiunque. ' +
          'Puoi cancellare l’archivio di questo iPad e ripristinare l’ultimo backup esportato sul disco SanDisk (servirà la password del backup).',
          { title: 'Password dimenticata', ok: 'Cancella e ripristina da backup', danger: true });
        if (!first) return;
        const second = await confirmDialog('Conferma definitiva: tutti i dati presenti su questo iPad verranno eliminati.',
          { title: 'Ultima conferma', ok: 'Cancella tutto', danger: true });
        if (!second) return;
        await DB.nuke();
        Lock.setFailures({});
        location.reload();
      });

      setTimeout(() => { if (!pw.disabled) pw.focus(); }, 80);
    });
  }
};

const S = {

function emptyAnamnesi() { return ANAMNESI_FIELDS.reduce((o, f) => { o[f.k] = ''; return o; }, {}); }
function emptyTechniques() { return Object.keys(TECHNIQUES).reduce((o, k) => { o[k] = []; return o; }, {}); }

function normalizePatient(p) {
  const base = PATIENT_FIELDS.reduce((o, f) => { o[f.k] = ''; return o; }, {});
  return {
    ...base,
    ...p,
    anamnesi: { ...emptyAnamnesi(), ...(p.anamnesi || {}) },
    consensi: { informato: null, privacy: null, ...(p.consensi || {}) },
    createdAt: p.createdAt || nowISO(),
    updatedAt: p.updatedAt || nowISO()
  };
}

function normalizeSession(s) {
  const tech = emptyTechniques();
  Object.keys(tech).forEach((k) => { if (Array.isArray(s.tecniche?.[k])) tech[k] = s.tecniche[k].slice(); });
  const fee = s.importo === '' || s.importo === null || s.importo === undefined ? null : Number(s.importo);
  return {
    date: todayISO(), sintomo: '', vas: null, palpatoria: '', test: '', tecnicheNote: '',
    esito: '', indicazioni: '', painMap: '', appointmentId: null,
    pagamento: 'da_saldare', pagatoIl: '', metodo: '', ricevuta: '',
    ...s,
    vas: Number.isFinite(s.vas) ? s.vas : null,
    importo: Number.isFinite(fee) && fee >= 0 ? fee : null,
    pagamento: PAY_STATUS[s.pagamento] ? s.pagamento : 'da_saldare',
    tecniche: tech,
    createdAt: s.createdAt || nowISO(),
    updatedAt: s.updatedAt || nowISO()
  };
}

function normalizeAppointment(a) {
  return {
    time: '09:00', duration: 60, type: 'Trattamento', status: 'pianificato', note: '',
    ...a,
    status: APPT_STATUS[a.status] ? a.status : 'pianificato',
    createdAt: a.createdAt || nowISO(),
    updatedAt: a.updatedAt || nowISO()
  };
}

function stamp(obj) { obj.updatedAt = nowISO(); return obj; }

async function loadAll() {
  const [patients, sessions, appointments, settingsRec] = await Promise.all([
    DB.getAll('patients'), DB.getAll('sessions'), DB.getAll('appointments'), DB.get('settings', 'app')
  ]);
  S.patients = new Map(patients.map((p) => [p.id, normalizePatient(p)]));
  S.sessions = new Map(sessions.map((s) => [s.id, normalizeSession(s)]));
  S.appointments = new Map(appointments.map((a) => [a.id, normalizeAppointment(a)]));
  S.settings = { ...DEFAULT_SETTINGS, ...(settingsRec?.value || {}) };
  S.pm.size = Number(S.settings.brushSize) || DEFAULT_SETTINGS.brushSize;
  S.pm.brush = BRUSHES.some((b) => b.id === S.settings.brush) ? S.settings.brush : 'pen';
  const op = Number(S.settings.brushOpacity);
  S.pm.opacity = Number.isFinite(op) && op >= 0.1 && op <= 1 ? op : DEFAULT_SETTINGS.brushOpacity;
}

function saveSettings() { return DB.put('settings', { key: 'app', value: { ...S.settings } }); }

function sortedPatients() {
  return [...S.patients.values()].sort((a, b) =>
    (a.cognome || '').localeCompare(b.cognome || '', 'it', { sensitivity: 'base' }) ||

function fmtEUR(n) {
  return Number.isFinite(n) ? new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(n) : '–';
}
function parseAmount(v) {
  const t = String(v ?? '').replace(/[€\s]/g, '').replace(',', '.');
  if (!t) return null;
  const n = Number(t);
  return Number.isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null;
}
function sumFees(list) { return list.reduce((t, s) => t + (Number.isFinite(s.importo) ? s.importo : 0), 0); }
function unpaidOf(patientId) {

    .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}

function sessionsOf(patientId, dir = 'desc') {
  const list = [...S.sessions.values()].filter((s) => s.patientId === patientId);
  list.sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.createdAt || '').localeCompare(b.createdAt || ''));

function appointmentsOf(patientId) {

/* ==========================================================================
   7. AUTOSALVATAGGIO (debounce + flush alla chiusura)
   ========================================================================== */
const Saver = {
  timers: new Map(),
  jobs: new Map(),
  lastSavedAt: null,

  schedule(key, job, delay = 450) {
    this.jobs.set(key, job);
    clearTimeout(this.timers.get(key));
    this.timers.set(key, setTimeout(() => this.run(key), delay));
    this.status('saving');
  },

  async run(key) {
    const job = this.jobs.get(key);
    clearTimeout(this.timers.get(key));
    this.timers.delete(key);
    this.jobs.delete(key);
    if (!job) return;
    try {
      await job();
      this.lastSavedAt = new Date();
      if (this.jobs.size === 0) this.status('saved');
    } catch (err) {
      console.error(err);
      this.status('error');
      toast('Salvataggio non riuscito: ' + (err?.message || err), 'error', 6000);
    }
  },

  async flush() {
    await Promise.all([...this.jobs.keys()].map((k) => this.run(k)));
  },

  status(state) {
    const el = document.getElementById('saveStatus');
    if (!el) return;
    el.classList.remove('saving', 'error');
    if (state === 'saving') { el.classList.add('saving'); el.textContent = 'Salvataggio…'; }
    else if (state === 'error') { el.classList.add('error'); el.textContent = 'Errore di salvataggio'; }
    else { el.textContent = this.lastSavedAt ? `Salvato alle ${DF.time.format(this.lastSavedAt)}` : 'Salvato'; }
  }
};

/* ==========================================================================
   8. TOAST, MODALI, DIALOGHI
   ========================================================================== */
function toast(message, type = 'info', ms = 3200) {
  const root = $('#toast-root');
  if (!root) return;
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.innerHTML = `${ic(type === 'error' ? 'alert' : type === 'ok' ? 'check' : 'info', 18)}<span>${esc(message)}</span>`;
  root.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 260); }, ms);
}

const Modal = {
  stack: [],

  open({ title, body, footer = '', size = '', onMount, onClose }) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.innerHTML = `
      <div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <header class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-modal-close aria-label="Chiudi">${ic('x')}</button></header>
        <div class="modal-body">${body}</div>
        ${footer ? `<footer class="modal-foot">${footer}</footer>` : ''}
      </div>`;
    $('#modal-root').appendChild(wrap);
    const entry = { wrap, onClose };
    this.stack.push(entry);
    const close = () => this.close(entry);
    wrap.addEventListener('click', (e) => {
      if (e.target === wrap || e.target.closest('[data-modal-close]')) close();
    });
    requestAnimationFrame(() => wrap.classList.add('show'));
    const el = wrap.querySelector('.modal');
    if (onMount) onMount(el, close);
    return { el, close };
  },

  close(entry = this.stack[this.stack.length - 1]) {
    if (!entry) return;
    const i = this.stack.indexOf(entry);
    if (i < 0) return;
    this.stack.splice(i, 1);
    entry.wrap.classList.remove('show');
    setTimeout(() => entry.wrap.remove(), 180);
    if (entry.onClose) entry.onClose();
  },

  closeAll() { while (this.stack.length) this.close(); }
};

function confirmDialog(message, { title = 'Conferma', ok = 'Conferma', cancel = 'Annulla', danger = false } = {}) {
  return new Promise((resolve) => {
    let settled = false;
    const finish = (v) => { if (!settled) { settled = true; resolve(v); } };
    Modal.open({
      title,
      size: 'sm',
      body: `<p class="confirm-text">${esc(message)}</p>`,
      footer: `<span class="spacer"></span><button class="btn" data-m="no">${esc(cancel)}</button><button class="btn ${danger ? 'danger' : 'primary'}" data-m="yes">${esc(ok)}</button>`,
      onClose: () => finish(false),
      onMount: (el, close) => {
        el.querySelector('[data-m="yes"]').addEventListener('click', () => { finish(true); close(); });
        el.querySelector('[data-m="no"]').addEventListener('click', () => close());
        setTimeout(() => el.querySelector('[data-m="yes"]').focus(), 50);
      }
    });
  });
}

function addCleanup(fn) { cleanups.push(fn); }

/* ==========================================================================
   9. SAGOMA ANATOMICA (disegnata via Path2D, nessuna immagine esterna)
   Coordinate in unità-figura: asse verticale 0 (vertice) → 976 (pianta del piede),
   metà destra dell'outline; la sinistra è speculare.
   ========================================================================== */
const BODY_HALF = [
  [18, 118], [22, 148], [68, 162], [104, 178], [121, 212], [127, 280], [136, 360], [150, 440],
  [164, 508], [176, 540], [172, 582], [150, 578], [144, 532], [127, 452], [110, 372], [97, 292],
  [88, 236], [84, 300], [77, 372], [87, 440], [95, 500], [88, 620], [80, 700], [78, 780],
  [70, 900], [86, 948], [82, 976], [30, 976], [34, 940], [40, 850], [38, 720], [30, 640],
  [20, 560], [6, 522]
];

let BODY_PATH = null;
function bodyPath() {
  if (BODY_PATH) return BODY_PATH;
  const pts = [...BODY_HALF, ...BODY_HALF.slice().reverse().map(([x, y]) => [-x, y])];
  const path = new Path2D();
  const n = pts.length;
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const start = mid(pts[n - 1], pts[0]);
  path.moveTo(start[0], start[1]);
  for (let i = 0; i < n; i++) {
    const p = pts[i];
    const m = mid(p, pts[(i + 1) % n]);
    path.quadraticCurveTo(p[0], p[1], m[0], m[1]);
  }
  path.closePath();
  BODY_PATH = path;
  return path;
}

function drawFigure(ctx, cx, top, scale, view, c) {
  ctx.save();
  ctx.translate(cx, top);
  ctx.scale(scale, scale);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  const body = bodyPath();
  ctx.fillStyle = c.fill;
  ctx.strokeStyle = c.stroke;
  ctx.lineWidth = 2.8;
  ctx.fill(body);
  ctx.stroke(body);

  const head = new Path2D();
  head.ellipse(0, 62, 40, 54, 0, 0, Math.PI * 2);
  ctx.fill(head);
  ctx.stroke(head);

  ctx.strokeStyle = c.detail;
  ctx.lineWidth = 2.2;
  const curve = (x1, y1, cx1, cy1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx1, cy1, x2, y2); ctx.stroke(); };
  const mirror = (fn) => { fn(1); fn(-1); };

  if (view === 'front') {
    mirror((k) => curve(8 * k, 172, 40 * k, 184, 78 * k, 168));          // clavicole
    mirror((k) => curve(14 * k, 262, 46 * k, 288, 80 * k, 252));         // margine pettorale
    mirror((k) => curve(6 * k, 334, 40 * k, 352, 74 * k, 360));          // arcate costali
    mirror((k) => curve(84 * k, 462, 50 * k, 488, 12 * k, 516));         // legamenti inguinali
    mirror((k) => { ctx.beginPath(); ctx.ellipse(57 * k, 655, 13, 17, 0, 0, Math.PI * 2); ctx.stroke(); }); // rotule
    mirror((k) => curve(52 * k, 900, 54 * k, 915, 60 * k, 930));         // malleoli
    ctx.setLineDash([5, 9]);
    curve(0, 184, 0, 330, 0, 478);                                        // linea mediana
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(0, 420, 5, 0, Math.PI * 2); ctx.stroke();    // ombelico
    curve(-8, 98, 0, 104, 8, 98);                                         // naso/bocca stilizzati
  } else {
    ctx.beginPath(); ctx.moveTo(0, 122); ctx.lineTo(0, 468); ctx.stroke(); // colonna
    for (let y = 136; y <= 456; y += 20) { ctx.beginPath(); ctx.moveTo(-5, y); ctx.lineTo(5, y); ctx.stroke(); }
    mirror((k) => {                                                       // scapole
      ctx.beginPath();
      ctx.moveTo(24 * k, 190);
      ctx.quadraticCurveTo(55 * k, 180, 80 * k, 196);
      ctx.quadraticCurveTo(70 * k, 250, 42 * k, 292);
      ctx.quadraticCurveTo(30 * k, 240, 24 * k, 190);
      ctx.stroke();
    });
    curve(-28, 96, 0, 110, 28, 96);                                       // linea occipitale
    mirror((k) => curve(10 * k, 448, 50 * k, 428, 86 * k, 452));         // creste iliache
    ctx.beginPath(); ctx.moveTo(-16, 462); ctx.lineTo(16, 462); ctx.lineTo(0, 502); ctx.closePath(); ctx.stroke(); // sacro
    curve(0, 502, 0, 515, 0, 530);                                        // solco intergluteo
    mirror((k) => curve(8 * k, 560, 48 * k, 578, 88 * k, 556));          // pieghe glutee
    mirror((k) => curve(36 * k, 668, 56 * k, 676, 78 * k, 666));         // cavi poplitei
    mirror((k) => curve(55 * k, 850, 53 * k, 890, 55 * k, 935));         // tendini d'Achille
  }
  ctx.restore();
}

function drawBodyScene(ctx, W, H) {
  const c = {
    fill: themeColor('--body-fill'),
    stroke: themeColor('--body-stroke'),
    detail: themeColor('--body-detail'),
    label: themeColor('--muted')
  };
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.scale(W / PM_W, H / PM_H);

  ctx.strokeStyle = c.detail;
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 12]);
  ctx.beginPath(); ctx.moveTo(800, 80); ctx.lineTo(800, 950); ctx.stroke();
  ctx.setLineDash([]);

  drawFigure(ctx, 400, 100, 0.86, 'front', c);
  drawFigure(ctx, 1200, 100, 0.86, 'back', c);

  ctx.fillStyle = c.label;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '600 30px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif';
  ctx.fillText('Fronte', 400, 50);
  ctx.fillText('Retro', 1200, 50);
  ctx.globalAlpha = 0.8;
  ctx.font = '700 26px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif';
  ctx.fillText('DX', 160, 560); ctx.fillText('SX', 640, 560);
  ctx.fillText('SX', 960, 560); ctx.fillText('DX', 1440, 560);
  ctx.restore();
}

function mountThumbs() {
  $$('canvas[data-thumb]').forEach((cv) => {
    const s = S.sessions.get(cv.dataset.thumb);
    const ctx = cv.getContext('2d');
    drawBodyScene(ctx, cv.width, cv.height);
    if (s && s.painMap) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, cv.width, cv.height);
      img.src = s.painMap;
    }
  });
}

/* ==========================================================================
   10. GRAFICI SVG PROGRAMMATICI
   ========================================================================== */
function vasChartSVG(list) {
  const data = list.filter((s) => s.date && Number.isFinite(s.vas))
    .sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || '').localeCompare(b.createdAt || ''));
  if (!data.length) return '';
  const W = 640, H = 220, L = 34, R = 20, T = 24, B = 40;
  const iw = W - L - R, ih = H - T - B;
  const X = (i) => (data.length === 1 ? L + iw / 2 : L + (i * iw) / (data.length - 1));
  const Y = (v) => T + ih - (v / 10) * ih;
  let grid = '';
  for (let v = 0; v <= 10; v += 2) {
    grid += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L - 10}" y="${Y(v) + 4}" class="axis" text-anchor="end">${v}</text>`;
  }
  const pts = data.map((s, i) => `${X(i).toFixed(1)},${Y(s.vas).toFixed(1)}`);
  const area = `M${X(0).toFixed(1)},${Y(0)} L${pts.join(' L')} L${X(data.length - 1).toFixed(1)},${Y(0)} Z`;
  const step = Math.max(1, Math.ceil(data.length / 7));
  const labels = data.map((s, i) => ((i % step === 0 || i === data.length - 1)
    ? `<text x="${X(i).toFixed(1)}" y="${H - 14}" class="axis" text-anchor="middle">${esc(fmtDate(s.date, 'dm'))}</text>` : '')).join('');
  const dots = data.map((s, i) => `
    <g class="vas-dot" data-action="open-session" data-id="${esc(s.id)}">
      <circle cx="${X(i).toFixed(1)}" cy="${Y(s.vas).toFixed(1)}" r="14" fill="transparent"/>
      <circle cx="${X(i).toFixed(1)}" cy="${Y(s.vas).toFixed(1)}" r="7" style="fill:${vasColor(s.vas)};stroke:var(--surface);stroke-width:2"/>
      <text x="${X(i).toFixed(1)}" y="${(Y(s.vas) - 14).toFixed(1)}" text-anchor="middle" class="val">${s.vas}</text>
    </g>`).join('');
  const gid = 'vasg' + Math.random().toString(36).slice(2, 8);
  const line = data.length > 1
    ? `<path d="${area}" fill="url(#${gid})"/><polyline points="${pts.join(' ')}" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`
    : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento del dolore VAS nelle sedute">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.26"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
    ${grid}${line}${dots}${labels}</svg>`;
}

function weekChartSVG(weekStart, appts) {
  const W = 560, H = 210, L = 30, R = 8, T = 16, B = 42;
  const today = todayISO();
  const days = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  const counts = days.map((d) => {
    const iso = toISODate(d);
    const list = appts.filter((a) => a.date === iso);
    return { iso, d, done: list.filter((a) => a.status === 'eseguito').length, plan: list.filter((a) => a.status === 'pianificato').length };
  });
  const max = Math.max(4, ...counts.map((c) => c.done + c.plan));
  const ih = H - T - B;
  const bw = (W - L - R) / 7;
  const Y = (v) => T + ih - (v / max) * ih;
  let out = '';
  [0, Math.round(max / 2), max].forEach((v) => {
    out += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L - 8}" y="${Y(v) + 4}" class="axis" text-anchor="end">${v}</text>`;
  });
  counts.forEach((c, i) => {
    const x = L + i * bw + bw * 0.2;
    const w = bw * 0.6;
    const hDone = (c.done / max) * ih;
    const hPlan = (c.plan / max) * ih;
    const base = T + ih;
    if (hDone > 0) out += `<rect x="${x.toFixed(1)}" y="${(base - hDone).toFixed(1)}" width="${w.toFixed(1)}" height="${hDone.toFixed(1)}" rx="5" style="fill:var(--ok)"/>`;
    if (hPlan > 0) out += `<rect x="${x.toFixed(1)}" y="${(base - hDone - hPlan).toFixed(1)}" width="${w.toFixed(1)}" height="${hPlan.toFixed(1)}" rx="5" style="fill:var(--info)" opacity=".8"/>`;
    const cls = c.iso === today ? 'axis today' : 'axis';
    out += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 22}" class="${cls}" text-anchor="middle">${esc(DF.wd.format(c.d))}</text>`;
    out += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 6}" class="${cls}" text-anchor="middle">${c.d.getDate()}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Appuntamenti della settimana">${out}</svg>
    <div class="legend"><span><i style="background:var(--ok)"></i>Eseguiti</span><span><i style="background:var(--info)"></i>Pianificati</span></div>`;
}

function apptRow(a, { showDate = false } = {}) {

function backupWarningHTML() {
  const hasData = S.patients.size > 0;
  if (!hasData) return '';
  const last = S.settings.lastBackupAt ? new Date(S.settings.lastBackupAt) : null;
  const days = last ? Math.floor((Date.now() - last.getTime()) / 86400000) : null;
  if (last && days < 7) return '';
  const text = last
    ? `L’ultimo backup risale a ${plural(days, 'giorno', 'giorni')} fa. Safari può cancellare i dati dei siti non usati di recente: esporta una copia sul disco esterno.`
    : 'Non hai ancora esportato un backup. Salva una copia cifrata sul disco esterno per proteggere l’archivio.';
  return `<div class="banner warn" style="margin-bottom:18px">${ic('alert')}<div><strong>Backup consigliato</strong><p>${esc(text)}</p></div><button class="btn sm" data-action="nav" data-view="backup">Vai al backup</button></div>`;
}

function viewAgenda() {

  const weekHTML = `<div class="week"><div class="week-grid">${days.map((d, i) => {
    const iso = toISODate(d);
    const list = byDay(iso);
    return `<div class="day ${iso === today ? 'today' : ''} ${i >= 5 ? 'weekend' : ''}">
      <div class="day-head"><span>${esc(DF.wd.format(d))}</span><strong>${d.getDate()}</strong>

  const listDays = days.filter((d) => byDay(toISODate(d)).length);
  const listHTML = listDays.length
    ? listDays.map((d) => {
        const iso = toISODate(d);
        return `<div class="day-group"><h3>${esc(fmtDate(iso, 'dmw'))}${iso === today ? ' (oggi)' : ''}</h3><ul class="appt-list">${byDay(iso).map((a) => apptRow(a)).join('')}</ul></div>`;
