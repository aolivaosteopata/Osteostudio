    : `<div class="card">${emptyState('Settimana libera', 'Non ci sono appuntamenti in questa settimana.', 'calendar')}</div>`;

  return `<div class="page">
    <header class="page-head">
      <div><p class="date-line">Agenda</p><h1>Appuntamenti</h1></div>

      <span class="range">${esc(fmtDate(wsI, 'dm'))} – ${esc(fmtDate(weI, 'medium'))}</span>
      <button class="btn sm" data-action="week-today">Oggi</button>
    </div>
    ${S.agendaMode === 'week' ? weekHTML : listHTML}

  </div>`;

/* ==========================================================================

function lastSessionByPatient() {
  const map = new Map();
  S.sessions.forEach((s) => {
    const cur = map.get(s.patientId);
    if (!cur || (s.date || '') > cur) map.set(s.patientId, s.date || '');
  });
  return map;
}

function patientListHTML() {
  const q = norm(S.search);
  const last = lastSessionByPatient();
  const list = sortedPatients().filter((p) => {
    if (!q) return true;
    const hay = norm(`${p.nome} ${p.cognome} ${p.cognome} ${p.nome} ${p.codiceFiscale} ${p.telefono} ${p.email}`);
    return q.split(/\s+/).every((t) => hay.includes(t));
  });
  if (!S.patients.size) return emptyState('Archivio vuoto', 'Crea la prima scheda con “Nuovo”.', 'users');
  if (!list.length) return emptyState('Nessun risultato', `Nessun paziente corrisponde a “${S.search}”.`, 'search');
  return `<div class="list-count">${plural(list.length, 'paziente', 'pazienti')}</div>` + list.map((p) => {
    const a = ageOf(p.dataNascita);
    const ls = last.get(p.id);
    const meta = [a !== null ? `${a} anni` : null, ls ? `ultima seduta ${fmtDate(ls, 'dm')}` : 'nessuna seduta'].filter(Boolean).join(', ');
    const flag = (p.anamnesi.controindicazioni || '').trim() ? '<span class="flag" title="Controindicazioni presenti"></span>' : '';
    return `<button class="p-item ${p.id === S.patientId ? 'active' : ''}" data-action="select-patient" data-id="${esc(p.id)}">
      <span class="avatar">${esc(initials(p))}</span><span class="grow"><strong>${esc(fullName(p))}</strong><small>${esc(meta)}</small></span>${flag}</button>`;
  }).join('');
}

function patientMetaLine(p) {
  const a = ageOf(p.dataNascita);
  return [
    a !== null ? `${a} anni` : null,
    p.dataNascita ? `nato/a il ${fmtDate(p.dataNascita, 'short')}` : null,
    p.telefono || null
  ].filter(Boolean).join(', ') || 'Completa i dati anagrafici';
}

function viewPatients() {
  const p = S.patientId ? S.patients.get(S.patientId) : null;
  if (S.patientId && !p) S.patientId = null;
  return `<div class="split ${p ? 'show-detail' : ''}">
    <section class="pane list-pane" aria-label="Elenco pazienti">
      <div class="list-head"><h1>Pazienti</h1><button class="btn primary sm" data-action="new-patient">${ic('plus', 18)}<span>Nuovo</span></button></div>
      <label class="search">${ic('search', 18)}<input id="patientSearch" type="search" placeholder="Cerca per nome o cognome" value="${esc(S.search)}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Cerca paziente"></label>
      <div id="patientList" class="patient-list">${patientListHTML()}</div>
    </section>
    <section class="pane detail-pane">${p ? patientDetailHTML(p) : `<div class="detail-empty">${emptyState('Seleziona un paziente', 'Scegli una scheda dall’elenco o creane una nuova.', 'users')}</div>`}</section>
  </div>`;
}

function patientDetailHTML(p) {
  const sessions = sessionsOf(p.id);
  const ci = (p.anamnesi.controindicazioni || '').trim();
  const nConsents = Object.keys(CONSENTS).filter((k) => p.consensi[k]).length;
  const tabs = [
    ['anagrafica', 'Anagrafica', ''],
    ['anamnesi', 'Anamnesi', ''],
    ['consensi', 'Consensi', `${nConsents}/2`],
    ['diario', 'Diario', String(sessions.length)],
    ['pagamenti', 'Pagamenti', unpaidOf(p.id).length ? String(unpaidOf(p.id).length) : '']
  ];
  let body = '';
  if (S.patientTab === 'anamnesi') body = tabAnamnesi(p);
  else if (S.patientTab === 'consensi') body = tabConsensi(p);
  else if (S.patientTab === 'diario') body = tabDiario(p, sessions);
  else if (S.patientTab === 'pagamenti') body = tabPagamenti(p);
  else body = tabAnagrafica(p);

  return `<div class="detail">
    <header class="p-head">
      <button class="btn ghost sm back-btn" data-action="back-to-list">${ic('chevL', 18)}<span>Elenco pazienti</span></button>
      <span class="avatar lg" id="pHeadAvatar">${esc(initials(p))}</span>
      <div class="p-head-text"><h2 id="pHeadName">${esc(fullName(p))}</h2><p class="muted" id="pHeadMeta">${esc(patientMetaLine(p))}</p></div>
      <div class="head-actions">
        <button class="btn" data-action="new-appt" data-patient="${esc(p.id)}">${ic('calendar', 18)}<span>Appuntamento</span></button>
        <button class="btn primary" data-action="new-session" data-patient="${esc(p.id)}">${ic('plus', 18)}<span>Nuova seduta</span></button>
      </div>
    </header>
    ${ci ? `<div class="banner warn">${ic('alert')}<div><strong>Controindicazioni</strong><p>${esc(ci)}</p></div></div>` : ''}
    <nav class="tabs" role="tablist">${tabs.map(([k, label, count]) =>
      `<button class="tab ${S.patientTab === k ? 'on' : ''}" role="tab" aria-selected="${S.patientTab === k}" data-action="patient-tab" data-tab="${k}">${label}${count ? `<span class="count">${count}</span>` : ''}</button>`).join('')}</nav>
    <div class="tab-body">${body}</div>
  </div>`;
}

function fieldHTML(f, value, scope) {
  const bind = `data-bind="${scope}.${f.k}"`;
  const id = `f-${scope}-${f.k}`;
  let control;
  if (f.type === 'select') {
    control = `<select id="${id}" ${bind}>${f.options.map(([v, l]) => `<option value="${esc(v)}" ${v === value ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  } else if (f.type === 'textarea') {
    control = `<textarea id="${id}" ${bind} rows="4">${esc(value)}</textarea>`;
  } else {
    const extra = f.type === 'email' ? 'autocapitalize="off" autocorrect="off"' : (f.type === 'text' ? 'autocapitalize="words"' : '');
    control = `<input id="${id}" type="${f.type}" ${bind} value="${esc(value)}" ${extra} ${f.upper ? 'class="upper" autocapitalize="characters"' : ''} autocomplete="off">`;
  }
  return `<label class="field ${f.wide ? 'wide' : ''}" for="${id}"><span>${esc(f.label)}</span>${control}</label>`;
}

function tabAnagrafica(p) {
  return `<section class="card"><div class="form-grid">${PATIENT_FIELDS.map((f) => fieldHTML(f, p[f.k] || '', 'p')).join('')}</div>
      <p class="meta-foot">Scheda creata il ${esc(fmtDateTime(p.createdAt))}. Ultima modifica il ${esc(fmtDateTime(p.updatedAt))}. Le modifiche si salvano automaticamente.</p></section>
    <section class="card danger-zone"><h2>Elimina paziente</h2><p>Rimuove la scheda, tutte le sedute, gli appuntamenti e i PDF dei consensi di questo paziente.</p>
      <button class="btn danger" data-action="delete-patient">${ic('trash', 18)}<span>Elimina paziente</span></button></section>`;
}

function tabAnamnesi(p) {
  return `<div class="ana-grid">${ANAMNESI_FIELDS.map((f) => `
    <section class="card ${f.warn ? 'warn' : ''}">
      <h3>${f.warn ? ic('alert', 18) : ''} ${esc(f.label)}</h3>
      <p class="muted">${esc(f.hint)}</p>
      <textarea data-bind="a.${f.k}" aria-label="${esc(f.label)}">${esc(p.anamnesi[f.k] || '')}</textarea>
    </section>`).join('')}</div>`;
}

function tabConsensi(p) {
  const card = (kind) => {
    const meta = p.consensi[kind];
    return `<div class="consent ${meta ? 'ok' : ''}">
      <div class="consent-icon">${ic('file', 26)}</div>
      <div class="consent-text"><strong>${esc(CONSENTS[kind].label)}</strong>
        ${meta ? `<span>${esc(meta.name)} (${esc(fmtBytes(meta.size))}), caricato il ${esc(fmtDateTime(meta.uploadedAt))}</span>` : '<span>Nessun documento caricato</span>'}</div>
      <span class="pill ${meta ? 'ok' : 'warn'}">${meta ? 'Presente' : 'Mancante'}</span>
      <div class="consent-actions">
        ${meta ? `
          <button class="btn primary" data-action="pdf-view" data-kind="${kind}">${ic('eye', 18)}<span>Vedi</span></button>
          <button class="btn" data-action="pdf-upload" data-kind="${kind}">${ic('upload', 18)}<span>Sovrascrivi</span></button>
          <button class="btn danger-ghost" data-action="pdf-remove" data-kind="${kind}">${ic('trash', 18)}<span>Rimuovi</span></button>`
        : `<button class="btn primary" data-action="pdf-upload" data-kind="${kind}">${ic('upload', 18)}<span>Carica PDF</span></button>`}
      </div>
    </div>`;
  };
  return `${Object.keys(CONSENTS).map(card).join('')}
    <p class="hint">I PDF vengono convertiti in Base64 e salvati nel database locale del browser. Sono inclusi automaticamente nel file di backup.</p>`;
}

function tabDiario(p, sessions) {
  const chart = vasChartSVG(sessions);
  return `<section class="card">
      <div class="card-head"><h3>Andamento del dolore (VAS 0–10)</h3><span class="muted sm">${plural(sessions.length, 'seduta', 'sedute')}</span></div>
      ${chart || emptyState('Nessun valore VAS registrato', 'Il grafico si popola indicando la VAS in ogni seduta.', 'activity')}
    </section>
    ${sessions.length ? `<div class="session-list">${sessions.map((s, i) => sessionCardHTML(s, sessions.length - i)).join('')}</div>`
      : `<section class="card" style="margin-top:18px">${emptyState('Diario vuoto', 'Registra la prima seduta con “Nuova seduta”.', 'clipboard')}</section>`}`;
}

function sessionCardHTML(s, number) {
  const tech = Object.keys(TECHNIQUES).filter((k) => s.tecniche[k].length);
  const badge = Number.isFinite(s.vas) ? `<span class="vas-badge" style="--c:${vasColor(s.vas)}">VAS ${s.vas}</span>` : '<span class="vas-badge none">VAS –</span>';
  return `<button class="s-card" data-action="open-session" data-id="${esc(s.id)}">
    <canvas data-thumb="${esc(s.id)}" width="480" height="300" aria-hidden="true"></canvas>
    <span class="s-body">
      <span class="s-top"><strong>Seduta ${number}, ${esc(fmtDate(s.date, 'medium'))}</strong><span class="s-pills">${payPill(s)}${badge}</span></span>
      <span class="s-sym">${s.sintomo ? esc(s.sintomo) : 'Sintomo principale non indicato'}</span>
      ${tech.length ? `<span class="s-tags">${tech.map((k) => `<span class="pill neutral">${esc(TECHNIQUES[k].label)} ${s.tecniche[k].length}</span>`).join('')}</span>` : ''}
    </span>
  </button>`;
}

/* ==========================================================================
   15. VISTA: SEDUTA (diario clinico + mappa del dolore)
   ========================================================================== */
function pmToolbarHTML() {
  const pm = S.pm;
  const drawing = pm.tool !== 'eraser';
  return `<div class="pm-toolbar" id="pmToolbar">
    <div class="pm-colors" role="radiogroup" aria-label="Tipo di dolore">
      ${PAIN_COLORS.map((c) => `<button class="swatch ${drawing && pm.color === c.color ? 'on' : ''}" data-pm="color" data-color="${c.color}" style="--sw:${c.color}" role="radio" aria-checked="${drawing && pm.color === c.color}"><span class="dot"></span><span>${esc(c.label)}</span></button>`).join('')}

        <button data-pm="tool" data-tool="eraser" class="${!drawing ? 'on' : ''}" aria-pressed="${!drawing}">${ic('eraser', 18)}<span>Gomma</span></button>

        <input type="range" id="pmOpacity" min="15" max="100" step="5" value="${Math.round(pm.opacity * 100)}" aria-label="Opacità del tratto"><output id="pmOpacityVal">${Math.round(pm.opacity * 100)}%</output></label>
      <label class="toggle"><input type="checkbox" id="pmPressure" ${S.settings.pressure ? 'checked' : ''}><span class="track"></span><span>Pressione</span></label>
      <label class="toggle"><input type="checkbox" id="pmPencil" ${S.settings.onlyPencil ? 'checked' : ''}><span class="track"></span><span>Solo Pencil</span></label>
      <div class="pm-actions">
        <button class="btn sm" data-pm="undo">${ic('undo', 18)}<span>Annulla</span></button>
        <button class="btn sm danger-ghost" data-pm="clear">${ic('trash', 18)}<span>Pulisci</span></button>

}

/* ---------- Tecniche osteopatiche ---------- */
function techGroupHTML(s, cat, def) {
  const sel = s.tecniche[cat];
  const custom = ((S.settings.customTechniques || {})[cat] || []).filter((x) => !def.items.includes(x));
  const extras = sel.filter((x) => !def.items.includes(x) && !custom.includes(x));
  const all = [...def.items, ...custom, ...extras];
  return `<div class="tech-group ${def.primary ? 'primary' : ''}"><h3>${esc(def.label)}<span id="tc-${cat}" class="${sel.length ? 'has' : ''}">${sel.length}</span></h3>
    <div class="chips">${all.map((item) =>
      `<button class="chip ${sel.includes(item) ? 'on' : ''}" data-action="tech-toggle" data-cat="${cat}" data-item="${esc(item)}" aria-pressed="${sel.includes(item)}">${esc(item)}</button>`).join('')}
      <button class="chip add" data-action="tech-add" data-cat="${cat}">${ic('plus', 16)}<span>Aggiungi</span></button></div></div>`;
}

function techSectionHTML(s) {
  const entries = Object.entries(TECHNIQUES);
  const primary = entries.filter(([, d]) => d.primary);
  const others = entries.filter(([, d]) => !d.primary);
  const otherCount = others.reduce((n, [c]) => n + s.tecniche[c].length, 0);
  return `${primary.map(([c, d]) => techGroupHTML(s, c, d)).join('')}
    <details class="tech-more" ${otherCount ? 'open' : ''}>
      <summary>Altre tecniche: ${others.map(([, d]) => esc(d.label.toLowerCase())).join(', ')}${otherCount ? `<span class="count">${otherCount}</span>` : ''}</summary>
      <div class="tech-grid">${others.map(([c, d]) => techGroupHTML(s, c, d)).join('')}</div>
    </details>`;
}

/* ---------- Pagamento della seduta ---------- */
function payPill(s) {
  const st = PAY_STATUS[s.pagamento] || PAY_STATUS.da_saldare;
  const amount = s.pagamento !== 'gratuita' && Number.isFinite(s.importo) ? ` ${fmtEUR(s.importo)}` : '';
  return `<span class="pill ${st.cls}">${st.label}${amount}</span>`;
}

function payCardInner(s) {
  const st = s.pagamento;
  const p = S.patients.get(s.patientId);
  const others = unpaidOf(s.patientId).filter((x) => x.id !== s.id);
  return `<div class="card-head"><h2>Pagamento</h2><span id="payPill">${payPill(s)}</span></div>
    <div class="pay-grid">
      <label class="field"><span>Importo della seduta (€)</span>
        <input type="text" inputmode="decimal" data-bind="s.importo" value="${Number.isFinite(s.importo) ? esc(String(s.importo).replace('.', ',')) : ''}" placeholder="Es. 60" autocomplete="off"></label>
      <div class="field"><span>Stato</span>
        <div class="seg pay-seg" role="radiogroup" aria-label="Stato del pagamento">${Object.entries(PAY_STATUS).map(([k, v]) =>
          `<button class="${st === k ? 'on' : ''} ps-${k}" data-action="pay-status" data-status="${k}" role="radio" aria-checked="${st === k}">${v.label}</button>`).join('')}</div></div>
      ${st === 'saldata' ? `
      <label class="field"><span>Pagata il</span><input type="date" data-bind="s.pagatoIl" value="${esc(s.pagatoIl)}"></label>
      <label class="field"><span>Metodo</span><select data-bind="s.metodo"><option value="">Non indicato</option>${PAY_METHODS.map((m) => `<option ${s.metodo === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></label>
      <label class="field"><span>N. ricevuta o fattura</span><input type="text" data-bind="s.ricevuta" value="${esc(s.ricevuta)}" autocomplete="off" placeholder="Facoltativo"></label>` : ''}
    </div>
    ${others.length ? `<p class="pay-note">${ic('info', 16)}<span>${esc(p?.nome || 'Il paziente')} ha ${others.length === 1 ? 'un’altra seduta' : `altre ${others.length} sedute`} da saldare (${esc(fmtEUR(sumFees(others)))}).</span>
      <button class="btn sm" data-action="open-payments" data-id="${esc(s.patientId)}">Vedi pagamenti</button></p>` : ''}`;
}

/* ---------- Scheda paziente: pagamenti ---------- */
function settleLabel(list) {
  const n = list.length;
  return n ? `Registra pagamento: ${plural(n, 'seduta', 'sedute')}, ${fmtEUR(sumFees(list))}` : 'Seleziona le sedute da saldare';
}

function tabPagamenti(p) {
  const all = sessionsOf(p.id, 'asc');
  const numberOf = new Map(all.map((s, i) => [s.id, i + 1]));
  const unpaid = all.filter((s) => s.pagamento === 'da_saldare');
  const paid = all.filter((s) => s.pagamento === 'saldata');
  const free = all.filter((s) => s.pagamento === 'gratuita');
  const year = todayISO().slice(0, 4);
  const paidYear = sumFees(paid.filter((s) => (s.pagatoIl || s.date || '').startsWith(year)));
  const missing = unpaid.filter((s) => !Number.isFinite(s.importo)).length;
  const groups = new Map();
  paid.forEach((s) => {
    const k = JSON.stringify([s.pagatoIl || '', s.metodo || '', s.ricevuta || '']);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(s);
  });
  const history = [...groups.entries()].sort((a, b) => b[0].localeCompare(a[0]));

  return `<section class="stats pay-stats">
      ${statCard(fmtEUR(sumFees(unpaid)), `Da saldare (${plural(unpaid.length, 'seduta', 'sedute')})`, 'euro')}
      ${statCard(fmtEUR(paidYear), `Incassato nel ${year}`, 'check')}
      ${statCard(String(free.length), free.length === 1 ? 'Seduta gratuita' : 'Sedute gratuite', 'info')}
    </section>
    <section class="card">
      <div class="card-head"><h3>Sedute da saldare</h3>${unpaid.length > 1 ? '<button class="btn sm ghost" data-action="pay-select-all">Seleziona o deseleziona tutte</button>' : ''}</div>
      ${unpaid.length ? `<ul class="pay-list">${unpaid.map((s) => `<li>
          <label class="pay-row"><input type="checkbox" data-paysel value="${esc(s.id)}" checked>
            <span class="grow"><strong>Seduta ${numberOf.get(s.id)}, ${esc(fmtDate(s.date, 'medium'))}</strong><small>${esc(s.sintomo || 'Sintomo non indicato')}</small></span>
            <span class="amt">${Number.isFinite(s.importo) ? esc(fmtEUR(s.importo)) : '<span class="muted">Importo non indicato</span>'}</span></label>
          <button class="icon-btn" data-action="open-session" data-id="${esc(s.id)}" aria-label="Apri la seduta">${ic('chevR', 18)}</button></li>`).join('')}</ul>
        ${missing ? `<p class="hint">${plural(missing, 'seduta', 'sedute')} senza importo: aprile per indicarlo, oppure imposta la tariffa predefinita in Impostazioni.</p>` : ''}
        <div class="row-end"><button class="btn primary" id="paySettleBtn" data-action="pay-settle">${ic('check', 18)}<span>${esc(settleLabel(unpaid))}</span></button></div>`
      : emptyState('Nessuna seduta da saldare', 'Il paziente è in regola con i pagamenti.', 'check')}
    </section>
    <section class="card">
      <div class="card-head"><h3>Storico dei pagamenti</h3></div>
      ${history.length ? `<ul class="pay-history">${history.map(([k, list]) => {
        const [d, m, r] = JSON.parse(k);
        const detail = [m, r ? `ricevuta ${r}` : '', `${plural(list.length, 'seduta', 'sedute')} del ${list.map((s) => fmtDate(s.date, 'dm')).join(', ')}`].filter(Boolean).join(' · ');
        return `<li><span class="grow"><strong>${d ? esc(fmtDate(d, 'medium')) : 'Data non indicata'}</strong><small>${esc(detail)}</small></span><span class="amt">${esc(fmtEUR(sumFees(list)))}</span></li>`;
      }).join('')}</ul>` : emptyState('Nessun pagamento registrato', 'I pagamenti registrati compariranno qui, raggruppati per data.', 'clock')}
    </section>`;
}

function viewSession() {

  const number = asc.findIndex((x) => x.id === s.id) + 1;
  const ci = (p?.anamnesi.controindicazioni || '').trim();
  const appt = s.appointmentId ? S.appointments.get(s.appointmentId) : null;

  return `<div class="page">
    <header class="session-head">
      <button class="btn ghost" data-action="back-from-session">${ic('chevL', 18)}<span>${esc(fullName(p))}</span></button>
      <div class="title"><h1 id="sessionTitle">Seduta del ${esc(fmtDate(s.date, 'medium'))}</h1>
        <p class="muted">Seduta n. ${number}${appt ? `, collegata all’appuntamento delle ${esc(appt.time)}` : ''}</p></div>
      <span class="save-status" id="saveStatus">Salvato</span>
      <button class="btn danger-ghost" data-action="delete-session">${ic('trash', 18)}<span>Elimina</span></button>
    </header>
    ${ci ? `<div class="banner danger" style="margin-bottom:18px">${ic('alert')}<div><strong>Controindicazioni del paziente</strong><p>${esc(ci)}</p></div></div>` : ''}

    <section class="card">
      <div class="session-top">
        <label class="field"><span>Data</span><input type="date" data-bind="s.date" value="${esc(s.date)}"></label>
        <label class="field"><span>Sintomo principale</span><input type="text" data-bind="s.sintomo" value="${esc(s.sintomo)}" placeholder="Es. lombalgia destra con irradiazione al gluteo" autocomplete="off"></label>
        <div class="field vas-field"><span>Intensità del dolore (VAS)</span>
          <div class="vas" role="radiogroup" aria-label="Scala VAS da 0 a 10">
            ${Array.from({ length: 11 }, (_, v) => `<button class="vas-btn ${s.vas === v ? 'on' : ''}" style="--c:${vasColor(v)}" data-action="set-vas" data-v="${v}" role="radio" aria-checked="${s.vas === v}">${v}</button>`).join('')}
          </div>
          <div class="vas-meta"><span>0 nessun dolore</span><strong id="vasLabel">${esc(vasLabel(s.vas))}</strong><span>10 massimo</span></div>
        </div>
      </div>
    </section>

    <section class="card" id="payCard">${payCardInner(s)}</section>

    <section class="card">
      <div class="card-head"><h2>Mappa del dolore</h2><span class="muted sm">Scegli pennello e opacità: con tratti semitrasparenti la sagoma resta visibile.</span></div>
      ${pmToolbarHTML()}
      <div class="pm-wrap" id="pmWrap">
        <canvas id="pmBg" aria-hidden="true"></canvas>
        <canvas id="pmDraw" role="img" aria-label="Mappa del dolore, vista anteriore e posteriore"></canvas>
        <canvas id="pmStroke" aria-hidden="true"></canvas>
        <div class="pm-cursor" id="pmCursor"></div>
      </div>
      <div class="pm-legend"><span>DX e SX indicano i lati del paziente.</span><span>Il disegno viene salvato automaticamente con la seduta.</span></div>
    </section>

    <div class="grid-2">
      <section class="card"><h2>Valutazione palpatoria</h2>

/* ==========================================================================
   19. MAPPA DEL DOLORE: disegno ad alta precisione con PointerEvents
   ========================================================================== */
const PainMap = {
  api: null,

  mount(session) {
    const bg = $('#pmBg');
    const cv = $('#pmDraw');
    const cursor = $('#pmCursor');
    const toolbar = $('#pmToolbar');
    if (!bg || !cv) return;

    bg.width = cv.width = PM_W;
    bg.height = cv.height = PM_H;
    const bctx = bg.getContext('2d');
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    const redrawBg = () => drawBodyScene(bctx, PM_W, PM_H);
    redrawBg();

    if (session.painMap) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, PM_W, PM_H);
      img.src = session.painMap;
    }

    const undo = [];
    let drawing = false;
    let activeId = null;
    let activeType = 'pen';
    let pts = [];
    let lastW = 0;

    const pushUndo = () => {
      try {
        undo.push(ctx.getImageData(0, 0, PM_W, PM_H));
        if (undo.length > UNDO_LIMIT) undo.shift();
      } catch (e) { console.error(e); }
    };

    const isBlank = () => {
      const d = ctx.getImageData(0, 0, PM_W, PM_H).data;
      for (let i = 3; i < d.length; i += 4) if (d[i] !== 0) return false;
      return true;
    };

    const save = (delay = 600) => Saver.schedule('pm:' + session.id, async () => {
      session.painMap = isBlank() ? '' : cv.toDataURL('image/png');
      stamp(session);
      await DB.put('sessions', session);
    }, delay);

    const toCanvas = (e) => {
      const r = cv.getBoundingClientRect();
      return {
        x: ((e.clientX - r.left) * PM_W) / r.width,
        y: ((e.clientY - r.top) * PM_H) / r.height,
        p: e.pointerType === 'pen' ? (e.pressure > 0 ? e.pressure : 0.5) : 0.5
      };
    };

    // Strato temporaneo: ogni tratto si disegna qui a piena intensità e al termine
    // viene fuso sul disegno con l'opacità scelta, così resta uniforme e senza macchie.
    const sc = $('#pmStroke');
    sc.width = PM_W;
    sc.height = PM_H;
    const sctx = sc.getContext('2d');
    let target = sctx;
    let brush = 'pen';
    let erasing = false;
    let dist = 0;
    const rand = Math.random;

    const widthFor = (p, type) => {
      const base = S.pm.size;
      if (S.pm.tool === 'eraser') return base * 2.2;
      const pr = S.settings.pressure && type === 'pen';
      switch (S.pm.brush) {
        case 'marker': return base * 1.8;
        case 'pencil': return Math.max(1, base * 0.6 * (pr ? 0.4 + 1.2 * p : 1));
        case 'spray': return base * 1.8 * (pr ? 0.6 + 0.8 * p : 1);
        case 'dots': return Math.max(2, base * 0.7 * (pr ? 0.6 + 0.8 * p : 1));
        default: return pr ? Math.max(0.8, base * (0.2 + 1.6 * p)) : base;
      }
    };

    const applyStyle = () => {
      erasing = S.pm.tool === 'eraser';
      brush = erasing ? 'pen' : S.pm.brush;
      target = erasing ? ctx : sctx;
      target.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
      target.globalAlpha = 1;
      target.strokeStyle = erasing ? '#000' : S.pm.color;
      target.fillStyle = erasing ? '#000' : S.pm.color;
      target.lineCap = 'round';
      target.lineJoin = 'round';
      sc.style.opacity = String(S.pm.opacity);
    };

    const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

    // Matita: grana irregolare lungo il tratto
    const pencilGrain = (a, b, w) => {
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      const steps = Math.max(1, Math.ceil(len / Math.max(0.8, w * 0.35)));
      const n = Math.max(3, Math.round(w * 1.3));
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        const cx = a.x + (b.x - a.x) * t;
        const cy = a.y + (b.y - a.y) * t;
        for (let k = 0; k < n; k++) {
          const ang = rand() * Math.PI * 2;
          const r = Math.sqrt(rand()) * w / 2;
          const s = 0.7 + rand() * 1.2;
          target.globalAlpha = 0.35 + rand() * 0.55;
          target.fillRect(cx + Math.cos(ang) * r - s / 2, cy + Math.sin(ang) * r - s / 2, s, s);
        }
      }
      target.globalAlpha = 1;
    };

    // Aerografo: nebulizzazione più densa al centro, ideale per dolore diffuso o irradiato
    const sprayAt = (x, y, w, p) => {
      const radius = w * 0.75 + 2;
      const n = Math.max(6, Math.round(radius * (0.6 + p) * 1.5));
      const s = Math.max(1.4, w / 11);
      target.globalAlpha = 0.7;
      for (let k = 0; k < n; k++) {
        const ang = rand() * Math.PI * 2;
        const r = radius * rand() * (0.35 + 0.65 * rand());
        target.fillRect(x + Math.cos(ang) * r - s / 2, y + Math.sin(ang) * r - s / 2, s, s);
      }
      target.globalAlpha = 1;
    };

    const dot = (x, y, w) => { target.beginPath(); target.arc(x, y, w / 2, 0, Math.PI * 2); target.fill(); };

    // Puntini: punti regolari lungo il percorso (utile per parestesie e formicolii)
    const dotsAlong = (a, b, w) => {
      const spacing = Math.max(w * 2.1, 6);
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      let covered = 0;
      let d = dist;
      while (len > 0 && d + (len - covered) >= spacing) {
        covered += spacing - d;
        d = 0;
        const t = covered / len;
        dot(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, w);
      }
      dist = d + (len - covered);
    };

    const startStroke = (pt) => {
      pts = [pt];
      dist = 0;
      lastW = widthFor(pt.p, activeType);
      if (brush === 'spray') { sprayAt(pt.x, pt.y, lastW, pt.p); return; }
      if (brush === 'pencil') { pencilGrain(pt, pt, lastW); return; }
      dot(pt.x, pt.y, lastW);
    };

    const addPoint = (pt) => {
      const prev = pts[pts.length - 1];
      if (prev && Math.hypot(pt.x - prev.x, pt.y - prev.y) < 0.6) return;
      const w = brush === 'marker' ? widthFor(pt.p, activeType) : lastW * 0.55 + widthFor(pt.p, activeType) * 0.45;
      if (brush === 'spray' || brush === 'pencil' || brush === 'dots') {
        if (brush === 'spray') {
          const len = Math.hypot(pt.x - prev.x, pt.y - prev.y);
          const steps = Math.max(1, Math.ceil(len / Math.max(1.5, w / 4)));
          for (let i = 1; i <= steps; i++) {
            const t = i / steps;
            sprayAt(prev.x + (pt.x - prev.x) * t, prev.y + (pt.y - prev.y) * t, w, pt.p);
          }
        } else if (brush === 'pencil') {
          pencilGrain(prev, pt, w);
        } else {
          dotsAlong(prev, pt, w);
        }
        pts = [pt];
        lastW = w;
        return;
      }
      pts.push(pt);
      if (pts.length > 3) pts.shift();
      target.lineWidth = w;
      target.beginPath();
      if (pts.length === 2) {
        const m = mid(pts[0], pts[1]);
        target.moveTo(pts[0].x, pts[0].y);
        target.lineTo(m.x, m.y);
      } else {
        const [p0, p1, p2] = pts;
        const m1 = mid(p0, p1);
        const m2 = mid(p1, p2);
        target.moveTo(m1.x, m1.y);
        target.quadraticCurveTo(p1.x, p1.y, m2.x, m2.y);
      }
      target.stroke();
      lastW = w;
    };

    const endStroke = () => {
      if ((brush === 'pen' || brush === 'marker') && pts.length >= 2) {
        const a = pts[pts.length - 2];
        const b = pts[pts.length - 1];
        const m = mid(a, b);
        target.lineWidth = lastW;
        target.beginPath();
        target.moveTo(m.x, m.y);
        target.lineTo(b.x, b.y);
        target.stroke();
      }
      pts = [];
      if (!erasing) {
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = S.pm.opacity;
        ctx.drawImage(sc, 0, 0);
        ctx.restore();
        sctx.clearRect(0, 0, PM_W, PM_H);
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    };

    const showCursor = (e) => {
      if (e.pointerType === 'touch' || drawing) { cursor.classList.remove('show'); return; }
      const r = cv.getBoundingClientRect();
      const d = Math.max(4, (widthFor(0.5, 'mouse') * r.width) / PM_W);
      cursor.style.width = cursor.style.height = `${d}px`;
      cursor.style.transform = `translate(${e.clientX - r.left - d / 2}px, ${e.clientY - r.top - d / 2}px)`;
      cursor.classList.add('show');
    };

    const onDown = (e) => {
      if (S.settings.onlyPencil && e.pointerType === 'touch') return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (drawing) {
        // Palm rejection: se la penna arriva mentre un tocco sta disegnando, il tratto del palmo viene annullato
        if (e.pointerType === 'pen' && activeType === 'touch' && undo.length) {
          ctx.putImageData(undo.pop(), 0, 0);
          sctx.clearRect(0, 0, PM_W, PM_H);
          pts = [];
          drawing = false;
        } else {
          return;
        }
      }
      e.preventDefault();
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* puntatore già rilasciato */ }
      pushUndo();
      drawing = true;
      activeId = e.pointerId;
      activeType = e.pointerType;
      cursor.classList.remove('show');
      applyStyle();
      startStroke(toCanvas(e));
    };

    const onMove = (e) => {
      if (!drawing) { showCursor(e); return; }
      if (e.pointerId !== activeId) return;
      e.preventDefault();
      const events = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : [];
      (events.length ? events : [e]).forEach((ce) => addPoint(toCanvas(ce)));
    };

    const onUp = (e) => {
      if (!drawing || e.pointerId !== activeId) return;
      drawing = false;
      activeId = null;
      endStroke();
      save();
    };

    const onLeave = () => cursor.classList.remove('show');
    const block = (e) => e.preventDefault();

    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', onUp);
    cv.addEventListener('pointerleave', onLeave);
    cv.addEventListener('touchstart', block, { passive: false });
    cv.addEventListener('touchmove', block, { passive: false });
    cv.addEventListener('contextmenu', block);

    const sizeInput = $('#pmSize');
    const sizeVal = $('#pmSizeVal');
    const sizeDot = $('#pmSizeDot');

    const syncToolbar = () => {
      $$('.swatch', toolbar).forEach((b) => {
        const on = S.pm.tool === 'pen' && b.dataset.color === S.pm.color;
        b.classList.toggle('on', on);
        b.setAttribute('aria-checked', String(on));
      });
      $$('[data-pm="brush"]', toolbar).forEach((b) => {
        const on = S.pm.tool === 'pen' && b.dataset.brush === S.pm.brush;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', String(on));
      });
      $$('[data-pm="tool"]', toolbar).forEach((b) => {
        b.classList.toggle('on', b.dataset.tool === S.pm.tool);
        b.setAttribute('aria-pressed', String(b.dataset.tool === S.pm.tool));
      });
      const r = cv.getBoundingClientRect();
      const d = Math.max(3, Math.min(30, (widthFor(0.5, 'mouse') * (r.width || PM_W / 2)) / PM_W));
      sizeDot.style.width = sizeDot.style.height = `${d}px`;
      sizeDot.classList.toggle('eraser', S.pm.tool === 'eraser');
      sizeDot.style.background = S.pm.tool === 'eraser' ? '' : S.pm.color;
      sizeDot.style.opacity = S.pm.tool === 'eraser' ? '1' : String(S.pm.opacity);
    };

    const onToolbarClick = (e) => {
      const b = e.target.closest('[data-pm]');
      if (!b) return;
      const kind = b.dataset.pm;
      if (kind === 'color') { S.pm.color = b.dataset.color; S.pm.tool = 'pen'; syncToolbar(); }
      else if (kind === 'tool') { S.pm.tool = b.dataset.tool; syncToolbar(); }
      else if (kind === 'brush') {
        S.pm.brush = b.dataset.brush;
        S.pm.tool = 'pen';
        S.settings.brush = S.pm.brush;
        syncToolbar();
        Saver.schedule('settings', saveSettings, 800);
      }
      else if (kind === 'undo') {
        if (!undo.length) { toast('Non ci sono tratti da annullare'); return; }
        ctx.putImageData(undo.pop(), 0, 0);
        save(300);
      } else if (kind === 'clear') {
        confirmDialog('Cancellare tutto il disegno di questa seduta? Potrai recuperarlo con “Annulla” finché resti nella seduta.', { title: 'Pulisci mappa', ok: 'Pulisci', danger: true })
          .then((ok) => {
            if (!ok) return;
            pushUndo();
            ctx.clearRect(0, 0, PM_W, PM_H);
            save(0);
          });
      }
    };
    toolbar.addEventListener('click', onToolbarClick);

    sizeInput.addEventListener('input', () => {
      S.pm.size = Number(sizeInput.value);
      sizeVal.textContent = sizeInput.value;
      S.settings.brushSize = S.pm.size;
      syncToolbar();
      Saver.schedule('settings', saveSettings, 800);
    });
    const opInput = $('#pmOpacity');
    const opVal = $('#pmOpacityVal');
    opInput.addEventListener('input', () => {
      S.pm.opacity = Number(opInput.value) / 100;
      opVal.textContent = `${opInput.value}%`;
      S.settings.brushOpacity = S.pm.opacity;
      sc.style.opacity = String(S.pm.opacity);
      syncToolbar();
      Saver.schedule('settings', saveSettings, 800);
    });
    $('#pmPressure').addEventListener('change', (e) => { S.settings.pressure = e.target.checked; syncToolbar(); Saver.schedule('settings', saveSettings); });
    $('#pmPencil').addEventListener('change', (e) => {
      S.settings.onlyPencil = e.target.checked;
      Saver.schedule('settings', saveSettings);
      toast(e.target.checked ? 'Disegno riservato ad Apple Pencil' : 'Disegno abilitato anche con le dita');
    });

    const onResize = () => syncToolbar();
    window.addEventListener('resize', onResize);
    requestAnimationFrame(syncToolbar);

    this.api = { redrawBg };
    addCleanup(() => {
      window.removeEventListener('resize', onResize);
      this.api = null;
    });
  }
};

   20. PAZIENTI, SEDUTE E APPUNTAMENTI
   ========================================================================== */
function openNewPatientModal() {
  Modal.open({
    title: 'Nuovo paziente',
    body: `<div class="form-grid">
      <label class="field"><span>Nome</span><input type="text" id="npNome" autocomplete="off" autocapitalize="words"></label>
      <label class="field"><span>Cognome</span><input type="text" id="npCognome" autocomplete="off" autocapitalize="words"></label>
      <label class="field"><span>Data di nascita</span><input type="date" id="npNascita"></label>
      <label class="field"><span>Telefono</span><input type="tel" id="npTel" autocomplete="off"></label>
    </div><p class="hint">Gli altri dati si completano nella scheda del paziente.</p>`,
    footer: `<span class="spacer"></span><button class="btn" data-modal-close>Annulla</button><button class="btn primary" data-m="create">${ic('check', 18)}<span>Crea scheda</span></button>`,
    onMount(el, close) {
      setTimeout(() => el.querySelector('#npNome').focus(), 80);
      el.querySelector('[data-m="create"]').addEventListener('click', async () => {
        const nome = el.querySelector('#npNome').value.trim();
        const cognome = el.querySelector('#npCognome').value.trim();
        if (!nome || !cognome) { toast('Inserisci nome e cognome', 'error'); return; }
        const p = normalizePatient({
          id: uid(), nome, cognome,
          dataNascita: el.querySelector('#npNascita').value,
          telefono: el.querySelector('#npTel').value.trim()
        });
        await DB.put('patients', p);
        S.patients.set(p.id, p);
        close();
        S.patientId = p.id;
        S.patientTab = 'anagrafica';
        S.search = '';
        await go('patients');
        toast('Scheda paziente creata', 'ok');
      });
    }
  });
}

function refreshPatientChrome(p) {
  const name = $('#pHeadName'); if (name) name.textContent = fullName(p);
  const meta = $('#pHeadMeta'); if (meta) meta.textContent = patientMetaLine(p);
  const av = $('#pHeadAvatar'); if (av) av.textContent = initials(p);
  const list = $('#patientList'); if (list) list.innerHTML = patientListHTML();
}

async function createSession(patientId, { date = null, appointmentId = null, open = true } = {}) {
  const p = S.patients.get(patientId);
  if (!p) { toast('Paziente non trovato', 'error'); return null; }
  const now = nowISO();
  let linked = appointmentId;
  const day = date || todayISO();
  if (!linked) {
    const appt = [...S.appointments.values()].find((a) => a.patientId === patientId && a.date === day && a.status === 'pianificato'
      && ![...S.sessions.values()].some((s) => s.appointmentId === a.id));
    if (appt) {
      linked = appt.id;
      appt.status = 'eseguito';
      stamp(appt);
      await DB.put('appointments', appt);
      toast(`Appuntamento delle ${appt.time} segnato come eseguito`, 'ok');
    }
  }
  const fee = Number.isFinite(S.settings.defaultFee) ? S.settings.defaultFee : null;
  const s = normalizeSession({ id: uid(), patientId, date: day, appointmentId: linked, importo: fee, pagamento: 'da_saldare', createdAt: now, updatedAt: now });
  await DB.put('sessions', s);
  S.sessions.set(s.id, s);
  if (open) openSession(s.id);
  return s;
}

function currentSession() { return S.sessions.get(S.sessionId) || null; }

function findOverlap(rec) {
  if (rec.status === 'annullato') return null;
  const start = toMinutes(rec.time);
  const end = start + Number(rec.duration || 0);
  return [...S.appointments.values()].find((a) => a.id !== rec.id && a.date === rec.date && a.status !== 'annullato'
    && toMinutes(a.time) < end && start < toMinutes(a.time) + Number(a.duration || 0)) || null;
}

function suggestTime(date) {
  const list = [...S.appointments.values()].filter((a) => a.date === date && a.status !== 'annullato');
  if (!list.length) return S.settings.dayStart || '09:00';
  const lastEnd = Math.max(...list.map((a) => toMinutes(a.time) + Number(a.duration || 0)));
  return fromMinutes(Math.min(lastEnd, 21 * 60));
}

function openApptModal(appt, defaults = {}) {
  const patients = sortedPatients();
  if (!patients.length) {
    confirmDialog('Per pianificare un appuntamento serve almeno un paziente in archivio. Vuoi crearne uno adesso?', { title: 'Nessun paziente', ok: 'Nuovo paziente' })
      .then((ok) => { if (ok) openNewPatientModal(); });
    return;
  }
  const isNew = !appt;
  const date = defaults.date || todayISO();
  const a = appt ? { ...appt } : normalizeAppointment({
    id: uid(),
    patientId: defaults.patientId || (S.view === 'patients' && S.patientId) || '',
    date,
    time: suggestTime(date),
    duration: Number(S.settings.defaultDuration) || 60,
    type: 'Trattamento',
    status: 'pianificato',
    note: ''
  });
  const durations = [...new Set([20, 30, 45, 60, 75, 90, 120, Number(a.duration)])].sort((x, y) => x - y);

  const body = `<div class="form-grid">
      <label class="field wide"><span>Paziente</span><select id="apPatient"><option value="">Seleziona un paziente</option>
        ${patients.map((p) => `<option value="${esc(p.id)}" ${p.id === a.patientId ? 'selected' : ''}>${esc(fullName(p))}</option>`).join('')}</select></label>
      <label class="field"><span>Data</span><input type="date" id="apDate" value="${esc(a.date)}"></label>
      <label class="field"><span>Ora</span><input type="time" id="apTime" value="${esc(a.time)}" step="300"></label>
      <label class="field"><span>Durata</span><select id="apDur">${durations.map((m) => `<option value="${m}" ${Number(a.duration) === m ? 'selected' : ''}>${m} minuti</option>`).join('')}</select></label>
      <label class="field"><span>Tipo</span><select id="apType">${[...new Set([...APPT_TYPES, a.type])].map((t) => `<option ${t === a.type ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
      <div class="field wide"><span>Stato</span><div class="seg full" id="apStatus" role="group">
        ${Object.entries(APPT_STATUS).map(([k, v]) => `<button type="button" data-status="${k}" class="st-${k} ${a.status === k ? 'on' : ''}">${v.label}</button>`).join('')}</div></div>
      <label class="field wide"><span>Note</span><textarea id="apNote" rows="3" placeholder="Note organizzative">${esc(a.note)}</textarea></label>
    </div>
    <p class="form-warn" id="apWarn" hidden></p>`;

  const footer = `${!isNew ? `<button class="btn danger-ghost" data-m="del">${ic('trash', 18)}<span>Elimina</span></button>` : ''}
    <span class="spacer"></span>
    ${!isNew ? `<button class="btn" data-m="session">${ic('clipboard', 18)}<span>Registra seduta</span></button>` : ''}
    <button class="btn primary" data-m="save">${ic('check', 18)}<span>${isNew ? 'Crea appuntamento' : 'Salva modifiche'}</span></button>`;

  Modal.open({
    title: isNew ? 'Nuovo appuntamento' : 'Appuntamento',
    body,
    footer,
    onMount(el, close) {
      let status = a.status;
      const q = (s) => el.querySelector(s);

      const collect = (silent = false) => {
        const rec = {
          ...a,
          patientId: q('#apPatient').value,
          date: q('#apDate').value,
          time: q('#apTime').value,
          duration: Number(q('#apDur').value),
          type: q('#apType').value,
          status,
          note: q('#apNote').value.trim()
        };
        if (!silent) {
          if (!rec.patientId) { toast('Seleziona il paziente', 'error'); return null; }
          if (!rec.date || !rec.time) { toast('Indica data e ora', 'error'); return null; }
        }
        return rec;
      };

      const checkOverlap = () => {
        const rec = collect(true);
        const warn = q('#apWarn');
        const other = rec.date && rec.time ? findOverlap(rec) : null;
        if (other) {
          warn.hidden = false;
          warn.textContent = `Si sovrappone all’appuntamento di ${fullName(S.patients.get(other.patientId))} delle ${other.time}.`;
        } else warn.hidden = true;
      };

      q('#apStatus').addEventListener('click', (e) => {
        const b = e.target.closest('[data-status]');
        if (!b) return;
        status = b.dataset.status;
        $$('#apStatus button', el).forEach((x) => x.classList.toggle('on', x === b));
        checkOverlap();
      });
      ['#apDate', '#apTime', '#apDur'].forEach((s) => q(s).addEventListener('change', checkOverlap));
      checkOverlap();

      const persist = async (rec) => {
        stamp(rec);
        await DB.put('appointments', rec);
        S.appointments.set(rec.id, rec);
      };

      q('[data-m="save"]').addEventListener('click', async () => {
        const rec = collect();
        if (!rec) return;
        await persist(rec);
        close();
        render();
        toast(isNew ? 'Appuntamento creato' : 'Appuntamento aggiornato', 'ok');
      });

      const del = q('[data-m="del"]');
      if (del) del.addEventListener('click', async () => {
        const ok = await confirmDialog('Eliminare definitivamente questo appuntamento?', { title: 'Elimina appuntamento', ok: 'Elimina', danger: true });
        if (!ok) return;
        await DB.delete('appointments', a.id);
        S.appointments.delete(a.id);
        close();
        render();
        toast('Appuntamento eliminato', 'ok');
      });

      const sess = q('[data-m="session"]');
      if (sess) sess.addEventListener('click', async () => {
        const rec = collect();
        if (!rec) return;
        rec.status = 'eseguito';
        await persist(rec);
        close();
        const existing = [...S.sessions.values()].find((s) => s.appointmentId === rec.id);
        if (existing) { openSession(existing.id); return; }
        await createSession(rec.patientId, { date: rec.date, appointmentId: rec.id });
      });
    }
  });
}

/* ==========================================================================
   21. PDF DEI CONSENSI (Base64 in IndexedDB)
   ========================================================================== */
async function onPdfSelected(file) {
  const target = S.pdfTarget;
  S.pdfTarget = null;
  if (!file || !target) return;
  const p = S.patients.get(target.patientId);
  if (!p) return;
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  if (!isPdf) { toast('Il file selezionato non è un PDF', 'error'); return; }
  if (file.size > MAX_PDF_BYTES) { toast(`Il PDF supera il limite di ${fmtBytes(MAX_PDF_BYTES)}`, 'error'); return; }

  const old = p.consensi[target.kind];
  if (old) {
    const ok = await confirmDialog(`Sostituire “${old.name}” con “${file.name}”? Il documento precedente verrà eliminato.`, { title: 'Sovrascrivi documento', ok: 'Sovrascrivi', danger: true });
    if (!ok) return;
  }

  let dataUrl = await readAsDataURL(file);
  dataUrl = 'data:application/pdf;base64,' + dataUrl.slice(dataUrl.indexOf(',') + 1);
  const rec = {
    id: uid(), patientId: p.id, kind: target.kind, name: file.name, mime: 'application/pdf',
    size: file.size, dataUrl, uploadedAt: nowISO(), updatedAt: nowISO()
  };
  await DB.put('files', rec);
  if (old && old.fileId) await DB.delete('files', old.fileId);
  p.consensi[target.kind] = { fileId: rec.id, name: rec.name, size: rec.size, uploadedAt: rec.uploadedAt };
  stamp(p);
  await DB.put('patients', p);
  if (S.view === 'patients') render();
  toast(`${CONSENTS[target.kind].short} salvato`, 'ok');
}

async function viewPdf(kind) {
  const p = S.patients.get(S.patientId);
  const meta = p?.consensi[kind];
  if (!meta) return;
  const rec = await DB.get('files', meta.fileId);
  if (!rec) { toast('Documento non trovato nel database', 'error'); return; }
  const url = URL.createObjectURL(dataUrlToBlob(rec.dataUrl));
  Modal.open({
    title: CONSENTS[kind].short,
    size: 'xl',
    body: `<p class="muted">${esc(fullName(p))}: ${esc(rec.name)} (${esc(fmtBytes(rec.size))})</p>
      <div class="pdf-frame"><iframe src="${url}" title="${esc(rec.name)}"></iframe></div>`,
    footer: `<span class="spacer"></span>
      <a class="btn" href="${url}" download="${esc(rec.name)}">${ic('download', 18)}<span>Scarica</span></a>
      <a class="btn primary" href="${url}" target="_blank" rel="noopener">${ic('eye', 18)}<span>Apri a schermo intero</span></a>`,
    onClose: () => setTimeout(() => URL.revokeObjectURL(url), 5 * 60 * 1000)
  });
}

async function removePdf(kind) {
  const p = S.patients.get(S.patientId);
  const meta = p?.consensi[kind];
  if (!meta) return;
  const ok = await confirmDialog(`Rimuovere “${meta.name}” dalla scheda di ${fullName(p)}?`, { title: 'Rimuovi documento', ok: 'Rimuovi', danger: true });
  if (!ok) return;
  if (meta.fileId) await DB.delete('files', meta.fileId);
  p.consensi[kind] = null;
  stamp(p);
  await DB.put('patients', p);
  render();
  toast('Documento rimosso', 'ok');
}

   22. BACKUP: ESPORTAZIONE E IMPORTAZIONE

function backupFileName(encrypted) {
  const d = new Date();
  return `OsteoStudio_backup_${toISODate(d)}_${pad(d.getHours())}${pad(d.getMinutes())}${encrypted ? '_cifrato' : ''}.json`;
}

async function prepareExport(btn) {
  const encrypt = !!$('#expEncrypt')?.checked;
  const pw = $('#expPw')?.value || '';
  const pw2 = $('#expPw2')?.value || '';
  if (encrypt) {
    if (!Vault.available()) { toast('La cifratura non è disponibile in questo contesto', 'error'); return; }
    if (pw.length < 8) { toast('La password deve contenere almeno 8 caratteri', 'error'); return; }
    if (pw !== pw2) { toast('Le due password non coincidono', 'error'); return; }
  } else {
    const ok = await confirmDialog('Il backup non cifrato contiene dati sanitari leggibili da chiunque abbia accesso al file. Continuare?', { title: 'Backup non cifrato', ok: 'Continua' });
    if (!ok) return;
  }
  btn.disabled = true;
  btn.querySelector('span').textContent = encrypt ? 'Cifratura in corso…' : 'Preparazione…';
  try {
    await Saver.flush();
    const [patients, sessions, appointments, files] = await Promise.all([
      DB.getAll('patients'), DB.getAll('sessions'), DB.getAll('appointments'), DB.getAll('files')
    ]);
    const payload = { patients, sessions, appointments, files, settings: { ...S.settings } };
    const meta = {
      app: APP.name, appVersion: APP.version, createdAt: nowISO(),
      counts: { patients: patients.length, sessions: sessions.length, appointments: appointments.length, files: files.length }
    };
    const out = encrypt
      ? { format: APP.backupFormat, version: APP.backupVersion, encrypted: true, meta, ...(await Vault.encrypt(JSON.stringify(payload), pw)) }
      : { format: APP.backupFormat, version: APP.backupVersion, encrypted: false, meta, payload };
    const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
    S.exportReady = { blob, name: backupFileName(encrypt), size: blob.size, meta, encrypted: encrypt };
    render();
    toast('Backup pronto: scegli dove salvarlo', 'ok');
  } catch (err) {
    console.error(err);
    toast('Preparazione del backup non riuscita: ' + (err?.message || err), 'error', 6000);
    btn.disabled = false;
    btn.querySelector('span').textContent = 'Prepara backup';
  }
}

async function markBackupDone() {
  S.settings.lastBackupAt = nowISO();
  await saveSettings();
}

async function shareExport() {
  const exp = S.exportReady;
  if (!exp) return;
  let file = null;
  try { file = new File([exp.blob], exp.name, { type: 'application/json' }); } catch (e) { file = null; }
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: exp.name });
      await markBackupDone();
      toast('Backup salvato', 'ok');
      render();
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      toast('Condivisione non disponibile: uso il download', 'info');
      downloadExport();
    }
  } else {
    downloadExport();
  }
}

function downloadExport() {
  const exp = S.exportReady;
  if (!exp) return;
  const url = URL.createObjectURL(exp.blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = exp.name;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 120000);
  markBackupDone().then(() => { if (S.view === 'backup') render(); });
  toast('Download avviato: trovi il file nella cartella Download', 'ok', 4500);
}

async function onImportSelected(file) {
  if (!file) return;
  let json;
  try {
    json = JSON.parse(await readAsText(file));
  } catch (err) {
    toast('Il file non è un JSON valido', 'error');
    return;
  }
  if (!json || json.format !== APP.backupFormat) { toast('Il file non è un backup di OsteoStudio', 'error'); return; }
  if (json.encrypted && !(json.kdf && json.cipher && json.data)) { toast('Il backup cifrato è incompleto o danneggiato', 'error'); return; }
  S.pendingImport = { name: file.name, size: file.size, json };
  render();
}

function validPayload(p) {
  return p && ['patients', 'sessions', 'appointments', 'files'].every((k) => Array.isArray(p[k]))
    && p.patients.every((x) => x && typeof x.id === 'string');
}

async function mergePayload(payload) {
  const newer = (cache, list) => list.filter((r) => {
    const cur = cache.get(r.id);
    return !cur || (r.updatedAt || '') > (cur.updatedAt || '');
  });
  await DB.putMany('patients', newer(S.patients, payload.patients).map(normalizePatient));
  await DB.putMany('sessions', newer(S.sessions, payload.sessions).map(normalizeSession));
  await DB.putMany('appointments', newer(S.appointments, payload.appointments).map(normalizeAppointment));
  for (const f of payload.files) {
    const exists = await DB.get('files', f.id);
    if (!exists) await DB.put('files', f);
  }
}

async function runImport(btn) {
  const imp = S.pendingImport;
  if (!imp) return;
  const mode = $('input[name="impMode"]:checked')?.value || 'merge';
  let payload;
  try {
    if (imp.json.encrypted) {
      if (!Vault.available()) { toast('La decifratura non è disponibile in questo contesto', 'error'); return; }
      const pw = $('#impPw')?.value || '';
      if (!pw) { toast('Inserisci la password del backup', 'error'); return; }
      btn.disabled = true;
      btn.querySelector('span').textContent = 'Decifratura…';
      payload = JSON.parse(await Vault.decrypt(imp.json, pw));
    } else {
      payload = imp.json.payload;
    }
  } catch (err) {
    toast('Password errata o file danneggiato', 'error', 5000);
    btn.disabled = false;
    btn.querySelector('span').textContent = 'Importa backup';
    return;
  }
  btn.disabled = false;
  btn.querySelector('span').textContent = 'Importa backup';
  if (!validPayload(payload)) { toast('Il contenuto del backup non è valido', 'error'); return; }

  const message = mode === 'replace'
    ? `Tutti i dati presenti su questo iPad verranno sostituiti con il backup (${plural(payload.patients.length, 'paziente', 'pazienti')}, ${plural(payload.sessions.length, 'seduta', 'sedute')}). Continuare?`
    : `I dati del backup verranno uniti a quelli presenti (${plural(payload.patients.length, 'paziente', 'pazienti')}, ${plural(payload.sessions.length, 'seduta', 'sedute')}). Continuare?`;
  const ok = await confirmDialog(message, { title: 'Importa backup', ok: 'Importa', danger: mode === 'replace' });
  if (!ok) return;

  try {
    await Saver.flush();
    if (mode === 'replace') {
      await DB.replaceAll({
        patients: payload.patients.map(normalizePatient),
        sessions: payload.sessions.map(normalizeSession),
        appointments: payload.appointments.map(normalizeAppointment),
        files: payload.files,
        settings: { ...S.settings, ...(payload.settings || {}), lastBackupAt: S.settings.lastBackupAt }
      });
    } else {
      await mergePayload(payload);
    }
    await loadAll();
    S.pendingImport = null;
    S.patientId = null;
    S.sessionId = null;
    applyTheme();
    renderSidebar();
    render();
    toast('Backup importato correttamente', 'ok');
  } catch (err) {
    console.error(err);
    toast('Importazione non riuscita: ' + (err?.message || err), 'error', 6000);
  }
}

async function fillStorageInfo() {
  const used = $('#stUsed');
  const pers = $('#stPersist');
  if (!used || !pers) return;
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const e = await navigator.storage.estimate();
      used.textContent = fmtBytes(e.usage || 0);
    } else used.textContent = 'Non disponibile';
    if (navigator.storage && navigator.storage.persisted) {
      pers.textContent = (await navigator.storage.persisted()) ? 'Attiva' : 'Non attiva';
    } else pers.textContent = 'Non supportata';
  } catch (e) {
    used.textContent = 'Non disponibile';
    pers.textContent = 'Non disponibile';
  }
}

/* ==========================================================================
   23. TEMA E ICONA DELLA SCHERMATA HOME
   ========================================================================== */
function applyTheme() {
  const t = S.settings.theme;
  const root = document.documentElement;
  if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t);
  else root.removeAttribute('data-theme');
  requestAnimationFrame(() => {
    const meta = $('#metaTheme');
    if (meta) meta.setAttribute('content', themeColor('--bg'));
    if (PainMap.api) PainMap.api.redrawBg();
    if ($('canvas[data-thumb]')) mountThumbs();
  });
}

function installTouchIcon() {
  // Se l'app è installata con le icone PNG (versione web), non serve l'icona generata.
  if (document.querySelector('link[rel="apple-touch-icon"][href$=".png"]') && location.protocol !== 'file:') return;
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 180;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 180, 180);
    g.addColorStop(0, '#2f7a6c');
    g.addColorStop(1, '#1f5249');
    x.fillStyle = g;
    x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#ffffff';
    const rr = (px, py, w, h, r) => {
      x.beginPath();
      x.moveTo(px + r, py);
      x.arcTo(px + w, py, px + w, py + h, r);
      x.arcTo(px + w, py + h, px, py + h, r);
      x.arcTo(px, py + h, px, py, r);
      x.arcTo(px, py, px + w, py, r);
      x.closePath();
      x.fill();
    };
    [[60, 30], [55, 58], [52, 86], [56, 114]].forEach(([px, py], i) => rr(px, py, 180 - px * 2, 20, 10 - i));
    x.beginPath(); x.moveTo(68, 142); x.lineTo(112, 142); x.lineTo(90, 158); x.closePath(); x.fill();
    const href = c.toDataURL('image/png');
    [['apple-touch-icon', null], ['icon', 'image/png']].forEach(([rel, type]) => {
      const link = document.createElement('link');
      link.rel = rel;
      if (type) link.type = type;
      link.href = href;
      document.head.appendChild(link);
    });
  } catch (e) { /* icona facoltativa */ }
}

function promptDialog(title, { label = '', placeholder = '', ok = 'OK', value = '' } = {}) {
  return new Promise((resolve) => {
    let settled = false;
    const finish = (v) => { if (!settled) { settled = true; resolve(v); } };
    Modal.open({
      title,
      size: 'sm',
      body: `<label class="field"><span>${esc(label)}</span><input type="text" id="promptInput" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off"></label>`,
      footer: `<span class="spacer"></span><button class="btn" data-m="no">Annulla</button><button class="btn primary" data-m="yes">${esc(ok)}</button>`,
      onClose: () => finish(null),
      onMount: (el, close) => {
        const input = el.querySelector('#promptInput');
        const confirm = () => { finish(input.value); close(); };
        el.querySelector('[data-m="yes"]').addEventListener('click', confirm);
        el.querySelector('[data-m="no"]').addEventListener('click', () => close());
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); confirm(); } });
        setTimeout(() => input.focus(), 60);
      }
    });
  });
}

/* ==========================================================================
   23b. PASSWORD DELL'APP
   ========================================================================== */
function openPasswordModal(mode) {
  const titles = { enable: 'Attiva password e cifratura', change: 'Cambia password', disable: 'Disattiva password' };
  const needOld = mode !== 'enable';
  const needNew = mode !== 'disable';
  const pwInput = (id, label) =>
    `<label class="field"><span>${label}</span><input type="password" id="${id}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>`;
  const body = `<div class="stack">
    ${mode === 'enable' ? '<p>Scegli una password di almeno 8 caratteri e annotala in un luogo sicuro: <strong>non esiste modo di recuperarla</strong>. Tutti i dati di questo iPad verranno cifrati.</p>' : ''}
    ${mode === 'change' ? '<p>L’intero archivio verrà cifrato di nuovo con la nuova password.</p>' : ''}
    ${mode === 'disable' ? '<p>I dati torneranno salvati senza cifratura su questo iPad e l’app non chiederà più la password.</p>' : ''}
    ${needOld ? pwInput('pwOld', mode === 'disable' ? 'Password' : 'Password attuale') : ''}
    ${needNew ? pwInput('pwNew', 'Nuova password') + pwInput('pwNew2', 'Ripeti la nuova password') : ''}
    <p class="lock-msg" id="pwMsg" role="alert"></p>
  </div>`;
  const okLabel = mode === 'enable' ? 'Attiva e cifra' : mode === 'change' ? 'Cambia password' : 'Disattiva';
  const footer = `<button class="btn" data-modal-close>Annulla</button>
    <button class="btn ${mode === 'disable' ? 'danger' : 'primary'}" id="pwOk">${okLabel}</button>`;
  Modal.open({
    title: titles[mode],
    body,
    footer,
    onMount(el, close) {
      const q = (s) => el.querySelector(s);
      const msg = q('#pwMsg');
      const ok = q('#pwOk');
      setTimeout(() => { const first = el.querySelector('input'); if (first) first.focus(); }, 80);
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); ok.click(); } });
      ok.addEventListener('click', async () => {
        const oldPw = q('#pwOld') ? q('#pwOld').value : '';
        const n1 = q('#pwNew') ? q('#pwNew').value : '';
        const n2 = q('#pwNew2') ? q('#pwNew2').value : '';
        msg.classList.remove('info');
        if (needOld && !oldPw) { msg.textContent = 'Inserisci la password attuale.'; return; }
        if (needNew && n1.length < 8) { msg.textContent = 'La nuova password deve avere almeno 8 caratteri.'; return; }
        if (needNew && n1 !== n2) { msg.textContent = 'Le due password non coincidono.'; return; }
        ok.disabled = true;
        msg.classList.add('info');
        msg.textContent = mode === 'disable' ? 'Decifratura dell’archivio in corso…' : 'Cifratura dell’archivio in corso…';
        try {
          await Saver.flush();
          if (mode === 'enable') await Lock.enable(n1);
          else if (mode === 'change') await Lock.change(oldPw, n1);
          else await Lock.disable(oldPw);
          close();
          renderSidebar();
          render();
          toast(mode === 'enable' ? 'Password attivata: l’archivio è cifrato'
            : mode === 'change' ? 'Password cambiata' : 'Password disattivata', 'ok', 4500);
        } catch (err) {
          console.error(err);
          ok.disabled = false;
          msg.classList.remove('info');
          msg.textContent = err?.message || 'Operazione non riuscita.';
        }
      });
    }
  });
}

/* ==========================================================================
   23c. USO OFFLINE (service worker per l'app installata sulla schermata Home)
   ========================================================================== */
function registerServiceWorker() {
  const secure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!('serviceWorker' in navigator) || !secure || registerServiceWorker.done) return;
  registerServiceWorker.done = true;
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController) toast('Nuova versione di OsteoStudio installata: sarà attiva alla prossima apertura.', 'info', 6000);
    hadController = true;
  });
  navigator.serviceWorker.register('./sw.js').catch((err) => console.warn('Service worker non registrato', err));
}

  'import-pick': () => { const input = $('#importInput'); input.value = ''; input.click(); },
  'import-run': (el) => runImport(el),
  'import-cancel': () => { S.pendingImport = null; render(); },

  'request-persist': async () => {
    if (!navigator.storage || !navigator.storage.persist) { toast('Il browser non supporta l’archiviazione persistente', 'error'); return; }
    const granted = await navigator.storage.persist();
    toast(granted ? 'Archiviazione persistente attiva' : 'Richiesta non accolta: aggiungi l’app alla schermata Home e riprova', granted ? 'ok' : 'info', 5000);
    fillStorageInfo();
  },

  'pay-status': (el) => {
    const s = currentSession();
    if (!s) return;
    const st = el.dataset.status;
    s.pagamento = st;
    if (st === 'saldata') { if (!s.pagatoIl) s.pagatoIl = todayISO(); } else { s.pagatoIl = ''; }
    stamp(s);
    Saver.schedule('session:' + s.id, () => DB.put('sessions', s), 250);
    const card = $('#payCard');
    if (card) card.innerHTML = payCardInner(s);
  },

  'open-payments': async (el) => {
    await Saver.flush();
    S.patientId = el.dataset.id;
    S.patientTab = 'pagamenti';
    S.sessionId = null;
    await go('patients');
    revealActiveTab();
  },

  'pay-select-all': () => {
    const boxes = $$('[data-paysel]');
    const allOn = boxes.every((b) => b.checked);
    boxes.forEach((b) => { b.checked = !allOn; });
    updateSettleButton();
  },

  'pay-settle': () => {
    const list = $$('[data-paysel]:checked').map((x) => S.sessions.get(x.value)).filter(Boolean);
    if (!list.length) { toast('Seleziona almeno una seduta'); return; }
    openSettleModal(list);
  },

  'tech-add': async (el) => {
    const s = currentSession();
    if (!s) return;
    const cat = el.dataset.cat;
    const name = await promptDialog(`Nuova tecnica: ${TECHNIQUES[cat].label}`, {
      label: 'Nome della tecnica', placeholder: 'Es. Bilanciamento dei fluidi', ok: 'Aggiungi' });
    const item = (name || '').trim().replace(/\s+/g, ' ');
    if (!item) return;
    const custom = { ...(S.settings.customTechniques || {}) };
    const list = [...(custom[cat] || [])];
    if (!TECHNIQUES[cat].items.includes(item) && !list.includes(item)) list.push(item);
    custom[cat] = list;
    S.settings.customTechniques = custom;
    await saveSettings();
    if (!s.tecniche[cat].includes(item)) s.tecniche[cat].push(item);
    stamp(s);
    Saver.schedule('session:' + s.id, () => DB.put('sessions', s), 250);
    const box = $('#techSection');
    if (box) box.innerHTML = techSectionHTML(s);
    toast(`“${item}” aggiunta a ${TECHNIQUES[cat].label}`, 'ok');
  },

  'tech-custom-remove': async (el) => {
    const { cat, item } = el.dataset;
    const ok = await confirmDialog(`Togliere “${item}” dall’elenco delle tecniche ${TECHNIQUES[cat].label.toLowerCase()}? Le sedute in cui è già stata usata la conservano.`,
      { title: 'Tecnica personalizzata', ok: 'Togli', danger: true });
    if (!ok) return;
    const custom = { ...(S.settings.customTechniques || {}) };
    custom[cat] = (custom[cat] || []).filter((x) => x !== item);
    S.settings.customTechniques = custom;
    await saveSettings();
    render();
  },

  'lock-enable': () => openPasswordModal('enable'),
  'lock-change': () => openPasswordModal('change'),
  'lock-disable': () => openPasswordModal('disable'),
  'lock-now': () => Lock.lockNow(),

  'wipe-all': async () => {
    const first = await confirmDialog('Vuoi cancellare tutti i dati di OsteoStudio da questo iPad?', { title: 'Cancella dati locali', ok: 'Continua', danger: true });
    if (!first) return;
    const second = await confirmDialog('Conferma definitiva: i dati non esportati in un backup andranno persi per sempre.', { title: 'Ultima conferma', ok: 'Cancella tutto', danger: true });
    if (!second) return;
    Saver.jobs.clear();
    await DB.replaceAll({ patients: [], sessions: [], appointments: [], files: [], settings: { ...DEFAULT_SETTINGS } });
    await loadAll();
    S.patientId = null;
    S.sessionId = null;
    S.exportReady = null;
    S.pendingImport = null;
    applyTheme();
    renderSidebar();
    await go('dashboard');
    toast('Tutti i dati locali sono stati cancellati', 'ok');
  }
};

/* Campi con autosalvataggio: data-bind="ambito.campo" */
function handleBind(el) {
  const [scope, field] = el.dataset.bind.split('.');
  const value = el.type === 'checkbox' ? el.checked : el.value;

  if (scope === 'p' || scope === 'a') {
    const p = S.patients.get(S.patientId);
    if (!p) return;
    if (scope === 'p') p[field] = field === 'codiceFiscale' ? String(value).toUpperCase() : value;
    else p.anamnesi[field] = value;
    stamp(p);
    Saver.schedule('patient:' + p.id, () => DB.put('patients', p));
    if (scope === 'p' && ['nome', 'cognome', 'dataNascita', 'telefono'].includes(field)) refreshPatientChrome(p);
  } else if (scope === 's') {
    const s = currentSession();
    if (!s) return;
    s[field] = field === 'importo' ? parseAmount(value) : value;
    stamp(s);
    Saver.schedule('session:' + s.id, () => DB.put('sessions', s));
    if (field === 'importo') { const pill = $('#payPill'); if (pill) pill.innerHTML = payPill(s); }
    if (field === 'date') {
      const t = $('#sessionTitle');
      if (t) t.textContent = `Seduta del ${fmtDate(value, 'medium')}`;
    }
  } else if (scope === 'set') {
    S.settings[field] = field === 'defaultDuration' ? Number(value) : field === 'defaultFee' ? parseAmount(value) : value;
    Saver.schedule('settings', saveSettings);
    if (field === 'studioName' || field === 'therapistName') {
      const brand = $('#sidebar .brand-text');
      if (brand) brand.innerHTML = `<strong>${esc(S.settings.studioName || APP.name)}</strong><span>${esc(S.settings.therapistName || 'Gestionale osteopatico')}</span>`;
    }
  }
}

function bindGlobalEvents() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const fn = ACTIONS[el.dataset.action];
    if (!fn) return;
    e.preventDefault();
    try {
      Promise.resolve(fn(el, e)).catch((err) => { console.error(err); toast(err?.message || 'Operazione non riuscita', 'error', 5000); });
    } catch (err) {
      console.error(err);
      toast(err?.message || 'Operazione non riuscita', 'error', 5000);
    }
  });

  const onField = (e) => {
    const el = e.target.closest && e.target.closest('[data-bind]');
    if (el) handleBind(el);
  };
  document.addEventListener('input', onField);
  document.addEventListener('change', onField);

  $('#pdfInput').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    onPdfSelected(f).catch((err) => { console.error(err); toast('Caricamento del PDF non riuscito: ' + (err?.message || err), 'error', 6000); });
  });
  $('#importInput').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    onImportSelected(f).catch((err) => { console.error(err); toast('Lettura del backup non riuscita', 'error'); });
  });

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && Modal.stack.length) Modal.close(); });
  document.addEventListener('change', (e) => { if (e.target && e.target.matches && e.target.matches('[data-paysel]')) updateSettleButton(); });

  const flushNow = () => { Saver.flush(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushNow(); });
  window.addEventListener('pagehide', flushNow);
  window.addEventListener('beforeunload', flushNow);

  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onScheme = () => { if (S.settings.theme === 'auto') applyTheme(); };
  if (mq.addEventListener) mq.addEventListener('change', onScheme); else if (mq.addListener) mq.addListener(onScheme);

  // Evita il pinch-zoom di Safari che interferisce con il disegno
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  // Aggiorna la dashboard al cambio di giorno
  let lastDay = todayISO();
  setInterval(() => {
    const d = todayISO();
    if (d !== lastDay) { lastDay = d; if (S.view === 'dashboard') render(); }
  }, 60000);
}

/* ==========================================================================
   25. AVVIO
   ========================================================================== */
function showFatal(err) {
  $('#main').innerHTML = `<div class="page"><div class="fatal">
    <h1>Archivio non disponibile</h1>
    <p class="muted">${esc(err?.message || String(err))}</p>
    <p class="hint">Verifica che Safari non sia in navigazione privata e che OsteoStudio sia aperto dall’icona sulla schermata Home (o dal suo indirizzo https), non dall’anteprima di app File. Poi ricarica la pagina.</p>
    <div class="row-end" style="justify-content:flex-start"><button class="btn primary" onclick="location.reload()">Ricarica</button></div>
  </div></div>`;
}

async function init() {
  installTouchIcon();
  renderSidebar();
  try {
    await DB.open();
    await Lock.loadConfig();
    if (Lock.enabled) {
      if (!Vault.available()) throw new Error('L’archivio è cifrato ma questo browser non offre la crittografia necessaria. Apri OsteoStudio dall’icona sulla schermata Home.');
      registerServiceWorker();
      await LockScreen.show();
    }
    await loadAll();
  } catch (err) {
    console.error(err);
    showFatal(err);
    return;
  }
  applyTheme();
  renderSidebar();
  bindGlobalEvents();
  Lock.bindAutoLock();
  registerServiceWorker();
  render();

  try {
    if (navigator.storage && navigator.storage.persisted && !(await navigator.storage.persisted()) && navigator.storage.persist) {
      await navigator.storage.persist();
    }
  } catch (e) { /* non bloccante */ }
}

document.addEventListener('DOMContentLoaded', init);
</script>
